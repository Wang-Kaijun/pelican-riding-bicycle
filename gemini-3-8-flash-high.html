<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>鹈鹕骑自行车 - 矢量SVG动画与速度调节</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    :root {
      --bg-sky-top: #7dd3fc;
      --bg-sky-bottom: #e0f2fe;
      --bg-sea-top: #38bdf8;
      --bg-sea-bottom: #0284c7;
      --road-color: #334155;
      --road-line: #facc15;
      --ground-color: #64748b;
    }

    [data-theme="sunset"] {
      --bg-sky-top: #f97316;
      --bg-sky-bottom: #fed7aa;
      --bg-sea-top: #ea580c;
      --bg-sea-bottom: #9a3412;
      --road-color: #1e293b;
      --road-line: #fbbf24;
      --ground-color: #475569;
    }

    [data-theme="night"] {
      --bg-sky-top: #0f172a;
      --bg-sky-bottom: #1e1b4b;
      --bg-sea-top: #1e293b;
      --bg-sea-bottom: #0f172a;
      --road-color: #090d16;
      --road-line: #38bdf8;
      --ground-color: #1e293b;
    }

    /* Custom range slider styling */
    input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      background: #e2e8f0;
      border-radius: 9999px;
      height: 8px;
      outline: none;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #0284c7;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(2, 132, 199, 0.4);
      border: 3px solid #ffffff;
      transition: transform 0.15s ease, background-color 0.15s ease;
    }
    input[type=range]::-webkit-slider-thumb:hover {
      transform: scale(1.15);
      background: #0369a1;
    }
    input[type=range]::-webkit-slider-thumb:active {
      transform: scale(1.25);
      background: #075985;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
    }

    [data-theme="night"] .glass-card {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #f8fafc;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col items-center justify-between p-3 sm:p-6 select-none transition-colors duration-500" id="mainBody">

  <!-- Header -->
  <header class="w-full max-w-4xl flex items-center justify-between mb-3 px-2">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-sky-500 flex items-center justify-center text-white text-xl shadow-md shadow-sky-500/30">
        🚴
      </div>
      <div>
        <h1 class="text-xl sm:text-2xl font-black tracking-tight text-slate-800" id="titleText">鹈鹕骑士 · Pelican On Wheels</h1>
        <p class="text-xs sm:text-sm text-slate-500" id="subtitleText">基于 SVG 几何运动学解算与动态逐帧渲染</p>
      </div>
    </div>

    <!-- Theme Switcher -->
    <div class="flex items-center gap-1.5 bg-white/80 dark:bg-slate-800/80 p-1.5 rounded-xl border border-slate-200/80 shadow-sm">
      <button onclick="setTheme('day')" title="日间晴空" class="px-2.5 py-1 text-xs rounded-lg font-medium transition-all bg-sky-100 text-sky-700 hover:bg-sky-200" id="btnThemeDay">☀️ 晴空</button>
      <button onclick="setTheme('sunset')" title="落日海滨" class="px-2.5 py-1 text-xs rounded-lg font-medium transition-all text-slate-600 hover:bg-orange-100 hover:text-orange-700" id="btnThemeSunset">🌅 落霞</button>
      <button onclick="setTheme('night')" title="璀璨星夜" class="px-2.5 py-1 text-xs rounded-lg font-medium transition-all text-slate-600 hover:bg-indigo-100 hover:text-indigo-700" id="btnThemeNight">🌙 星夜</button>
    </div>
  </header>

  <!-- Main Animation Canvas (SVG) Container -->
  <main class="w-full max-w-4xl bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200/80 relative flex flex-col">
    <!-- Overlay Speed Badge -->
    <div class="absolute top-4 left-4 z-10 flex items-center gap-2">
      <div class="glass-card px-3.5 py-1.5 rounded-full flex items-center gap-2 font-mono text-xs sm:text-sm font-bold text-sky-700 shadow-sm border border-white/60">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse" id="statusDot"></span>
        <span id="speedBadge">24.0 km/h</span>
        <span class="text-slate-400">|</span>
        <span id="cadenceBadge" class="text-slate-600">65 RPM</span>
      </div>
    </div>

    <!-- Bell Dinger effect toast -->
    <div id="bellToast" class="absolute top-4 right-4 z-10 transition-all duration-300 opacity-0 pointer-events-none transform translate-y-[-10px] glass-card px-3.5 py-1.5 rounded-full text-amber-600 font-bold text-sm shadow-lg flex items-center gap-1.5">
      🔔 叮铃铃！让一让，鹈鹕来啦~
    </div>

    <!-- Fish fed toast -->
    <div id="fishToast" class="absolute top-16 right-4 z-10 transition-all duration-300 opacity-0 pointer-events-none transform translate-y-[-10px] glass-card px-3.5 py-1.5 rounded-full text-emerald-600 font-bold text-sm shadow-lg flex items-center gap-1.5">
      🐟 咕噜！大鱼吞进喉囊啦！
    </div>

    <!-- SVG Canvas -->
    <div class="w-full aspect-[16/9] sm:aspect-[2/1] relative bg-sky-200 overflow-hidden">
      <svg id="stage" class="w-full h-full block" viewBox="0 0 1000 550" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- Sky Gradient -->
          <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="var(--bg-sky-top)" id="skyStop1"/>
            <stop offset="100%" stop-color="var(--bg-sky-bottom)" id="skyStop2"/>
          </linearGradient>

          <!-- Sea Gradient -->
          <linearGradient id="seaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="var(--bg-sea-top)"/>
            <stop offset="100%" stop-color="var(--bg-sea-bottom)"/>
          </linearGradient>

          <!-- Pelican Bill / Pouch Gradient -->
          <linearGradient id="pouchGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#fbbf24"/>
            <stop offset="60%" stop-color="#f59e0b"/>
            <stop offset="100%" stop-color="#ea580c"/>
          </linearGradient>

          <!-- Wheel Rim Metallic Gradient -->
          <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#94a3b8"/>
            <stop offset="50%" stop-color="#f1f5f9"/>
            <stop offset="100%" stop-color="#64748b"/>
          </linearGradient>

          <!-- Bike Frame Gradient -->
          <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#0284c7"/>
            <stop offset="50%" stop-color="#38bdf8"/>
            <stop offset="100%" stop-color="#0369a1"/>
          </linearGradient>

          <!-- Scarf Gradient -->
          <linearGradient id="scarfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ef4444"/>
            <stop offset="100%" stop-color="#b91c1c"/>
          </linearGradient>

          <!-- Drop Shadow Filter -->
          <filter id="shadowFilter" x="-10%" y="-10%" width="120%" height="130%">
            <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.25"/>
          </filter>

          <!-- Ground Shadow Filter -->
          <radialGradient id="groundShadowGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#0f172a" stop-opacity="0.45"/>
            <stop offset="70%" stop-color="#0f172a" stop-opacity="0.2"/>
            <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
          </radialGradient>
        </defs>

        <!-- SKY BACKGROUND -->
        <rect x="0" y="0" width="1000" height="420" fill="url(#skyGrad)" />

        <!-- CELESTIAL BODY (Sun/Moon) -->
        <g id="celestialGroup">
          <circle id="celestialBody" cx="820" cy="110" r="42" fill="#fef08a" filter="drop-shadow(0 0 16px rgba(254, 240, 138, 0.8))" />
        </g>

        <!-- CLOUDS (PARALLAX LAYER 1) -->
        <g id="cloudsGroup"></g>

        <!-- DISTANT MOUNTAINS & LIGHTHOUSE (PARALLAX LAYER 2) -->
        <g id="mountainsGroup"></g>

        <!-- OCEAN / SEA (PARALLAX LAYER 3) -->
        <rect x="0" y="320" width="1000" height="90" fill="url(#seaGrad)" />
        <g id="seaWavesGroup"></g>

        <!-- DISTANT COASTAL ROAD RAILINGS & TREES (PARALLAX LAYER 4) -->
        <g id="coastSceneryGroup"></g>

        <!-- GROUND & ROAD SURFACE -->
        <rect x="0" y="410" width="1000" height="140" fill="var(--ground-color)" />
        <!-- Asphalt bike path -->
        <polygon points="0,430 1000,430 1000,530 0,530" fill="var(--road-color)" />
        <!-- Road curb highlight -->
        <line x1="0" y1="430" x2="1000" y2="430" stroke="#94a3b8" stroke-width="3"/>
        
        <!-- DASHED ROAD STRIPES (PARALLAX LAYER 5) -->
        <g id="roadStripesGroup"></g>

        <!-- ROAD FOREGROUND DETAILS (Pebbles & Grass) -->
        <g id="roadForegroundGroup"></g>

        <!-- BIKE & RIDER SHADOW ON GROUND -->
        <ellipse id="bikeShadow" cx="490" cy="485" rx="170" ry="14" fill="url(#groundShadowGrad)" />

        <!-- ============================================== -->
        <!-- THE BICYCLE & PELICAN CHARACTER LAYER -->
        <!-- ============================================== -->
        <g id="cyclistAndBike">

          <!-- 1. BACK LEG (Far side leg, darker shade for depth) -->
          <g id="backLegGroup" opacity="0.85">
            <!-- Thigh -->
            <path id="backThigh" d="" stroke="#cbd5e1" stroke-width="16" stroke-linecap="round" fill="none"/>
            <!-- Shin -->
            <path id="backShin" d="" stroke="#fb923c" stroke-width="9" stroke-linecap="round" fill="none"/>
            <!-- Back Webbed Foot & Pedal -->
            <g id="backFootGroup"></g>
          </g>

          <!-- 2. REAR WHEEL -->
          <g id="rearWheelGroup" transform="translate(350, 435)">
            <!-- Outer Tire -->
            <circle cx="0" cy="0" r="54" fill="none" stroke="#1e293b" stroke-width="9" />
            <circle cx="0" cy="0" r="49" fill="none" stroke="#f8fafc" stroke-width="1.5" opacity="0.6"/>
            <!-- Rim -->
            <circle cx="0" cy="0" r="46" fill="none" stroke="url(#metalGrad)" stroke-width="4" />
            <!-- Spokes (dynamic rotation) -->
            <g id="rearSpokes"></g>
            <!-- Hub -->
            <circle cx="0" cy="0" r="8" fill="#475569" stroke="#94a3b8" stroke-width="2"/>
            <!-- Rear Gear Cog -->
            <circle cx="0" cy="0" r="14" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="4,2"/>
          </g>

          <!-- 3. FRONT WHEEL -->
          <g id="frontWheelGroup" transform="translate(630, 435)">
            <!-- Outer Tire -->
            <circle cx="0" cy="0" r="54" fill="none" stroke="#1e293b" stroke-width="9" />
            <circle cx="0" cy="0" r="49" fill="none" stroke="#f8fafc" stroke-width="1.5" opacity="0.6"/>
            <!-- Rim -->
            <circle cx="0" cy="0" r="46" fill="none" stroke="url(#metalGrad)" stroke-width="4" />
            <!-- Spokes (dynamic rotation) -->
            <g id="frontSpokes"></g>
            <!-- Hub -->
            <circle cx="0" cy="0" r="8" fill="#475569" stroke="#94a3b8" stroke-width="2"/>
          </g>

          <!-- 4. BICYCLE FRAME -->
          <g id="bikeFrameGroup">
            <!-- Chain Stay (Rear Hub 350,435 to BB 475,435) -->
            <line x1="350" y1="435" x2="475" y2="435" stroke="url(#frameGrad)" stroke-width="6" stroke-linecap="round"/>
            
            <!-- Seat Stay (Rear Hub 350,435 to Seat Post Cluster 445,340) -->
            <line x1="350" y1="435" x2="445" y2="340" stroke="url(#frameGrad)" stroke-width="6" stroke-linecap="round"/>
            
            <!-- Seat Tube (BB 475,435 to Seat Post Cluster 445,340) -->
            <line x1="475" y1="435" x2="445" y2="340" stroke="url(#frameGrad)" stroke-width="8" stroke-linecap="round"/>
            <!-- Seat Post Extension & Saddle -->
            <line x1="445" y1="340" x2="440" y2="318" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
            <!-- Bicycle Saddle (Seat) -->
            <path d="M 416,316 C 428,310 455,310 468,318 C 460,323 435,324 416,316 Z" fill="#1e293b" filter="url(#shadowFilter)"/>
            <path d="M 420,317 C 435,313 452,313 464,318" stroke="#f59e0b" stroke-width="2" fill="none"/>

            <!-- Down Tube (BB 475,435 to Head Tube Base 595,345) -->
            <line x1="475" y1="435" x2="595" y2="345" stroke="url(#frameGrad)" stroke-width="9" stroke-linecap="round"/>

            <!-- Top Tube (Seat Post Cluster 445,340 to Head Tube Top 590,320) -->
            <line x1="445" y1="340" x2="590" y2="320" stroke="url(#frameGrad)" stroke-width="7" stroke-linecap="round"/>

            <!-- Head Tube (595,350 to 588,310) -->
            <line x1="597" y1="355" x2="588" y2="310" stroke="url(#frameGrad)" stroke-width="10" stroke-linecap="round"/>

            <!-- Front Fork (Head Tube Base 597,355 to Front Hub 630,435) -->
            <line x1="597" y1="355" x2="630" y2="435" stroke="url(#frameGrad)" stroke-width="6" stroke-linecap="round"/>

            <!-- Stem & Handlebars -->
            <polyline points="588,310 585,288 605,282" stroke="#94a3b8" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            <!-- Handlebar Grip -->
            <path d="M 598,283 Q 612,280 615,290" stroke="#f59e0b" stroke-width="6" fill="none" stroke-linecap="round"/>

            <!-- Front Reflector & Vintage Bell on Handlebar -->
            <circle cx="615" cy="278" r="6" fill="#fbbf24" stroke="#d97706" stroke-width="1.5"/>
            <!-- Bell Dome -->
            <path id="bikeBell" d="M 602,277 C 602,271 611,271 611,277 Z" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5" class="cursor-pointer hover:fill-amber-300"/>

            <!-- Water Bottle Cage on Down Tube -->
            <rect x="520" y="380" width="8" height="24" rx="4" transform="rotate(-38 520 380)" fill="#38bdf8" opacity="0.9"/>

            <!-- Bicycle Chain Loop -->
            <path d="M 350,424 L 475,413 A 22,22 0 0,1 475,457 L 350,446 A 11,11 0 0,1 350,424 Z" fill="none" stroke="#475569" stroke-width="2.5" stroke-dasharray="3,1.5"/>

            <!-- Chainring / Crankset at BB (475, 435) -->
            <circle cx="475" cy="435" r="22" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
            <circle cx="475" cy="435" r="7" fill="#64748b"/>
          </g>

          <!-- 5. CRANK ARMS & PEDALS (Dynamic) -->
          <g id="crankGroup"></g>

          <!-- 6. PELICAN BODY & HEAD & WINGS -->
          <g id="pelicanGroup">
            <!-- Tail Feathers -->
            <g id="pelicanTail">
              <path d="M 425,305 Q 395,295 385,310 Q 405,320 430,318 Z" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
              <path d="M 423,310 Q 390,305 380,322 Q 402,328 428,322 Z" fill="#cbd5e1" opacity="0.6"/>
            </g>

            <!-- Main Torso -->
            <path id="pelicanTorso" d="M 430,320 C 420,290 450,260 490,260 C 530,260 550,285 545,320 C 540,345 450,350 430,320 Z" fill="#f8fafc" filter="url(#shadowFilter)"/>
            <!-- Body Feather Texture / Highlights -->
            <path d="M 455,275 C 475,270 515,272 530,290" stroke="#e2e8f0" stroke-width="3" fill="none" stroke-linecap="round"/>
            <path d="M 450,295 C 470,290 510,295 530,315" stroke="#e2e8f0" stroke-width="3" fill="none" stroke-linecap="round"/>

            <!-- Neck (Graceful S-Curve from chest to head) -->
            <path id="pelicanNeck" d="M 525,270 C 535,235 525,190 545,160 C 555,145 570,145 575,160 C 560,195 555,235 545,275 Z" fill="#ffffff" filter="url(#shadowFilter)"/>

            <!-- Stylish Fluttering Red Scarf -->
            <g id="scarfGroup">
              <!-- Scarf Wrap around neck -->
              <ellipse cx="546" cy="225" rx="14" ry="7" fill="url(#scarfGrad)" transform="rotate(-20 546 225)"/>
              <!-- Scarf Tails blowing back in the wind (dynamic waving via JS) -->
              <path id="scarfTail1" d="M 536,227 Q 495,225 460,210 Q 490,235 534,233 Z" fill="url(#scarfGrad)"/>
              <path id="scarfTail2" d="M 538,230 Q 500,240 470,232 Q 495,250 536,236 Z" fill="#991b1b"/>
            </g>

            <!-- Pelican Head -->
            <circle id="pelicanHead" cx="572" cy="152" r="23" fill="#ffffff" filter="url(#shadowFilter)"/>

            <!-- Cute Cycling Cap (Retro racing cap with visor) -->
            <g id="cyclingCap">
              <!-- Cap Dome -->
              <path d="M 552,148 C 552,130 588,130 592,148 Z" fill="#0284c7"/>
              <!-- White/Red Racing Stripe on cap -->
              <path d="M 567,133 C 572,133 574,147 574,148 L 570,148 C 570,147 568,133 567,133 Z" fill="#f8fafc"/>
              <!-- Cap Visor flipped up cute style -->
              <path d="M 588,145 C 602,140 610,132 612,134 C 610,144 594,150 588,148 Z" fill="#38bdf8" stroke="#0284c7" stroke-width="1"/>
            </g>

            <!-- Pelican Eye -->
            <circle cx="580" cy="148" r="5" fill="#fef08a" stroke="#d97706" stroke-width="1"/>
            <circle id="eyePupil" cx="581" cy="148" r="2.6" fill="#0f172a"/>
            <!-- Eye Catchlight -->
            <circle cx="582" cy="147" r="0.9" fill="#ffffff"/>
            <!-- Eyelid for blinking -->
            <path id="eyelid" d="M 575,148 Q 580,144 585,148" stroke="#cbd5e1" stroke-width="0" fill="none"/>

            <!-- THE PROUD PELICAN BEAK & THROAT POUCH -->
            <!-- Huge upper bill -->
            <path id="upperBill" d="M 585,145 C 630,150 675,160 720,165 C 726,166 726,172 721,173 C 675,172 630,163 585,158 Z" fill="#f59e0b" stroke="#d97706" stroke-width="1.5" filter="url(#shadowFilter)"/>
            <!-- Bill tip hook (classic pelican feature) -->
            <path d="M 719,165 Q 726,168 722,175 Q 716,172 719,165 Z" fill="#b45309"/>

            <!-- Throat Pouch (Gular pouch) - stretchy, translucent, carrying a fish! -->
            <path id="throatPouch" d="M 570,166 Q 600,225 650,210 Q 710,195 721,173 C 670,172 620,165 570,166 Z" fill="url(#pouchGrad)" opacity="0.92" stroke="#d97706" stroke-width="1.5"/>

            <!-- Fish inside the pouch! (Tail poking or silhouette visible) -->
            <g id="fishInPouch" transform="translate(635, 185) rotate(-15)">
              <!-- Fish body silhouette -->
              <ellipse cx="0" cy="0" rx="18" ry="8" fill="#38bdf8" opacity="0.85"/>
              <!-- Fish tail -->
              <polygon points="14,0 24,-7 24,7" fill="#0284c7" opacity="0.85"/>
              <!-- Fish cute surprised eye -->
              <circle cx="-10" cy="-2" r="2.5" fill="#ffffff"/>
              <circle cx="-10.5" cy="-2" r="1.2" fill="#0f172a"/>
              <!-- Tiny bubble -->
              <circle cx="-16" cy="-6" r="2" fill="none" stroke="#ffffff" opacity="0.8"/>
            </g>

            <!-- Pelican Wing (Arm) holding the handlebars -->
            <!-- Folded wing base on torso -->
            <path id="pelicanWingBase" d="M 465,280 C 475,265 515,265 525,285 C 530,305 490,325 465,280 Z" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5"/>
            <!-- Wing arm reaching forward to grip handlebar (605, 285) -->
            <path id="pelicanWingArm" d="M 505,280 Q 560,270 603,285" stroke="#ffffff" stroke-width="14" stroke-linecap="round" fill="none" filter="url(#shadowFilter)"/>
            <!-- Wing feather fingers gripping the handlebar -->
            <path d="M 598,280 Q 608,280 606,290" stroke="#e2e8f0" stroke-width="4" fill="none" stroke-linecap="round"/>
            <path d="M 602,282 Q 612,282 610,292" stroke="#cbd5e1" stroke-width="3" fill="none" stroke-linecap="round"/>
          </g>

          <!-- 7. FOREGROUND LEG (Front side, full bright lighting) -->
          <g id="frontLegGroup">
            <!-- Thigh (Hip 455,325 to Knee) -->
            <path id="frontThigh" d="" stroke="#ffffff" stroke-width="18" stroke-linecap="round" fill="none" filter="url(#shadowFilter)"/>
            <!-- Shin (Knee to Ankle) -->
            <path id="frontShin" d="" stroke="#f97316" stroke-width="10" stroke-linecap="round" fill="none"/>
            <!-- Knee joint cap -->
            <circle id="frontKneeCap" cx="0" cy="0" r="7" fill="#ea580c"/>
            <!-- Front Webbed Foot & Pedal -->
            <g id="frontFootGroup"></g>
          </g>

        </g>
        <!-- END CYCLIST AND BIKE -->

        <!-- SPEED LINES (Active when going fast) -->
        <g id="speedLinesGroup" opacity="0"></g>

      </svg>
    </div>

    <!-- Interactive Dashboard & Speed Slider Controls -->
    <div class="p-4 sm:p-5 bg-white/95 border-t border-slate-200/80 flex flex-col gap-4">
      
      <!-- Speed Slider Control Section -->
      <div class="flex flex-col gap-2">
        <div class="flex items-center justify-between">
          <label for="speedSlider" class="text-sm font-bold text-slate-700 flex items-center gap-2">
            <span class="text-lg">⚡</span> 骑行速度控制 (Speed Control)
          </label>
          <div class="flex items-center gap-2">
            <span class="text-xs text-slate-400">当前挡位:</span>
            <span id="speedMultiplierText" class="text-sm font-black font-mono px-2 py-0.5 rounded-md bg-sky-100 text-sky-700">1.0x 巡航</span>
          </div>
        </div>

        <div class="flex items-center gap-3">
          <span class="text-xs font-semibold text-slate-400 w-8 text-right">0</span>
          <input 
            type="range" 
            id="speedSlider" 
            min="0" 
            max="100" 
            value="35" 
            class="w-full h-2.5 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-sky-600 transition-all"
            aria-label="调节骑行速度"
          >
          <span class="text-xs font-semibold text-slate-400 w-8">MAX</span>
        </div>
      </div>

      <!-- Quick Speed Preset Buttons & Fun Controls -->
      <div class="flex flex-wrap items-center justify-between gap-2 pt-1 border-t border-slate-100">
        
        <!-- Presets -->
        <div class="flex items-center gap-1.5 flex-wrap">
          <button onclick="setSpeedPreset(0)" class="preset-btn px-3 py-1.5 text-xs font-semibold rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 transition-all flex items-center gap-1">
            🛑 停车休息

  <!-- JAVASCRIPT ANIMATION ENGINE & INTERACTION -->
  <script>
    /* =========================================================================
       1. SCENE SETUP & PARALLAX BACKGROUND GENERATION
       ========================================================================= */
    const svg = document.getElementById('stage');
    const cloudsGroup = document.getElementById('cloudsGroup');

    // Create Clouds
    const clouds = [
      { x: 80, y: 70, scale: 1.1, speed: 0.15 },

    clouds.forEach((c, i) => {

    // Create Distant Coastal Mountains & Lighthouse
    const mountains = [
      { x: 0, points: "0,340 120,240 250,340 380,220 540,340 700,210 880,340 1020,230 1150,340", fill: "#93c5fd", opacity: "0.4" },
      { x: 0, points: "0,350 180,270 340,350 500,260 680,350 860,250 1050,350", fill: "#60a5fa", opacity: "0.5" }
    ];
    mountains.forEach((m, idx) => {
      const p1 = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
      p1.setAttribute('points', m.points);
      p1.setAttribute('fill', m.fill);
      p1.setAttribute('opacity', m.opacity);
      p1.setAttribute('id', `mountain_${idx}_1`);

      const p2 = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
      p2.setAttribute('points', m.points);
      p2.setAttribute('fill', m.fill);
      p2.setAttribute('opacity', m.opacity);
      p2.setAttribute('id', `mountain_${idx}_2`);
      mountainsGroup.appendChild(p2);
      m.el1 = p1;
      m.el2 = p2;
    });

    // Distant Lighthouse
    const lighthouseGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    lighthouseGroup.innerHTML = `
      <!-- Cliff base -->
      <polygon points="760,330 840,330 830,260 770,260" fill="#64748b"/>
      <!-- Tower -->
      <polygon points="785,260 815,260 810,185 790,185" fill="#f8fafc"/>
      <polygon points="787,240 813,240 812,225 788,225" fill="#ef4444"/>
      <polygon points="789,205 811,205 810,195 790,195" fill="#ef4444"/>
      <!-- Lantern Room -->
      <rect x="788" y="177" width="24" height="8" rx="2" fill="#fbbf24"/>
      <!-- Dome Roof -->
      <path d="M 788,177 Q 800,165 812,177 Z" fill="#334155"/>
      <!-- Light beam -->
      <polygon points="800,181 400,100 400,240" fill="#fef08a" opacity="0.15"/>
    `;
    mountainsGroup.appendChild(lighthouseGroup);

    // Ocean Waves
    const waveWidth = 120;
    const waveCount = 12;
    const waves = [];
    for (let i = 0; i < waveCount; i++) {
      const w = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      w.setAttribute('stroke', '#ffffff');
      w.setAttribute('stroke-width', '2');
      w.setAttribute('stroke-linecap', 'round');
      w.setAttribute('opacity', '0.5');
      w.setAttribute('fill', 'none');
      seaWavesGroup.appendChild(w);
      waves.push({
        el: w,
        baseX: i * 90,
        y: 335 + (i % 4) * 16,
        length: 40 + (i % 3) * 25

    }

    // Coastal Fence Posts & Palm Trees (Layer 4)
    const sceneryItems = [];
    const numPosts = 16;
    for (let i = 0; i < numPosts; i++) {
      const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      // Post
      g.innerHTML = `
        <rect x="0" y="390" width="8" height="36" rx="2" fill="#d97706"/>
        <rect x="1" y="390" width="2" height="36" fill="#fde68a" opacity="0.7"/>
        <circle cx="4" cy="392" r="3" fill="#b45309"/>
      `;
      coastSceneryGroup.appendChild(g);
      sceneryItems.push({ el: g, x: i * 75, type: 'post' });
    }

    // Connect posts with rope
    const ropePath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    ropePath.setAttribute('stroke', '#78350f');
    ropePath.setAttribute('stroke-width', '2.5');
    ropePath.setAttribute('fill', 'none');
    coastSceneryGroup.insertBefore(ropePath, coastSceneryGroup.firstChild);

    // Palm trees
    const palmTrees = [
      { x: 150, el: null },
      { x: 550, el: null },
      { x: 920, el: null }
    ];
    palmTrees.forEach((pt, i) => {
      const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      g.innerHTML = `
        <!-- Trunk -->
        <path d="M 0,420 Q 15,360 25,310" stroke="#78350f" stroke-width="9" stroke-linecap="round" fill="none"/>
        <path d="M 0,420 Q 15,360 25,310" stroke="#b45309" stroke-width="5" stroke-linecap="round" fill="none"/>
        <!-- Leaves -->
        <g transform="translate(25, 310)">
          <path d="M 0,0 Q -40,-25 -70,-5" stroke="#15803d" stroke-width="4" fill="none" stroke-linecap="round"/>
          <path d="M 0,0 Q -25,-45 -40,-65" stroke="#16a34a" stroke-width="4" fill="none" stroke-linecap="round"/>
          <path d="M 0,0 Q 20,-55 35,-65" stroke="#15803d" stroke-width="4" fill="none" stroke-linecap="round"/>
          <path d="M 0,0 Q 50,-35 80,-20" stroke="#22c55e" stroke-width="4" fill="none" stroke-linecap="round"/>
          <path d="M 0,0 Q 40,-10 65,15" stroke="#16a34a" stroke-width="4" fill="none" stroke-linecap="round"/>
        </g>
      `;
      coastSceneryGroup.appendChild(g);
      pt.el = g;
    });

    // Road Dashed Lines (Layer 5)
    const roadStripes = [];
    const numStripes = 14;
    for (let i = 0; i < numStripes; i++) {
      const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      r.setAttribute('y', '478');
      r.setAttribute('width', '55');
      r.setAttribute('height', '6');
      r.setAttribute('rx', '3');
      r.setAttribute('fill', 'var(--road-line)');
      roadStripesGroup.appendChild(r);
      roadStripes.push({ el: r, x: i * 85 });
    }

    // Road Foreground Pebbles / Grass tufts
    const pebbles = [];
    for (let i = 0; i < 20; i++) {
      const p = document.createElementNS('http://www.w3.org/2000/svg', 'ellipse');
      p.setAttribute('cy', `${518 + (i % 4) * 5}`);
      p.setAttribute('rx', `${3 + (i % 3)}`);
      p.setAttribute('ry', '2');
      p.setAttribute('fill', i % 2 === 0 ? '#475569' : '#1e293b');
      roadForegroundGroup.appendChild(p);
      pebbles.push({ el: p, x: i * 55 });
    }

    // Speed Lines (Turbo effect)
    const speedLines = [];
    for (let i = 0; i < 12; i++) {
      const sl = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      sl.setAttribute('y1', `${120 + i * 28}`);
      sl.setAttribute('y2', `${120 + i * 28}`);
      sl.setAttribute('stroke', '#ffffff');
      sl.setAttribute('stroke-width', `${1 + Math.random() * 2}`);
      sl.setAttribute('stroke-dasharray', '30, 20');
      sl.setAttribute('stroke-linecap', 'round');
      sl.setAttribute('opacity', '0.7');
      speedLinesGroup.appendChild(sl);
      speedLines.push({ el: sl, x: Math.random() * 1000, len: 60 + Math.random() * 80 });
    }

    // Generate Wheel Spokes
    const rearSpokesGroup = document.getElementById('rearSpokes');
    const frontSpokesGroup = document.getElementById('frontSpokes');
    const numSpokes = 16;
    for (let i = 0; i < numSpokes; i++) {
      const angle = (i * 360 / numSpokes) * Math.PI / 180;
      const x2 = Math.cos(angle) * 46;
      const y2 = Math.sin(angle) * 46;

      const rSpoke = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      rSpoke.setAttribute('x1', '0');
      rSpoke.setAttribute('y1', '0');
      rSpoke.setAttribute('x2', x2.toFixed(1));
      rSpoke.setAttribute('y2', y2.toFixed(1));
      rSpoke.setAttribute('stroke', '#cbd5e1');
      rSpoke.setAttribute('stroke-width', '1.2');
      rearSpokesGroup.appendChild(rSpoke);

      const fSpoke = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      fSpoke.setAttribute('x1', '0');
      fSpoke.setAttribute('y1', '0');
      fSpoke.setAttribute('x2', x2.toFixed(1));
      fSpoke.setAttribute('y2', y2.toFixed(1));
      fSpoke.setAttribute('stroke', '#cbd5e1');
      fSpoke.setAttribute('stroke-width', '1.2');
      frontSpokesGroup.appendChild(fSpoke);
    }

    /* =========================================================================
       2. INVERSE KINEMATICS & PELICAN ANATOMY RIG
       ========================================================================= */
    const crankGroup = document.getElementById('crankGroup');
    const frontThigh = document.getElementById('frontThigh');
    const frontShin = document.getElementById('frontShin');
    const frontKneeCap = document.getElementById('frontKneeCap');
    const frontFootGroup = document.getElementById('frontFootGroup');
    const backThigh = document.getElementById('backThigh');
    const backShin = document.getElementById('backShin');
    const backFootGroup = document.getElementById('backFootGroup');

    const pelicanGroup = document.getElementById('pelicanGroup');
    const pelicanTorso = document.getElementById('pelicanTorso');
    const pelicanNeck = document.getElementById('pelicanNeck');
    const pelicanHead = document.getElementById('pelicanHead');
    const eyePupil = document.getElementById('eyePupil');
    const eyelid = document.getElementById('eyelid');
    const upperBill = document.getElementById('upperBill');
    const throatPouch = document.getElementById('throatPouch');
    const fishInPouch = document.getElementById('fishInPouch');
    const pelicanWingArm = document.getElementById('pelicanWingArm');
    const scarfTail1 = document.getElementById('scarfTail1');
    const scarfTail2 = document.getElementById('scarfTail2');
    const bikeShadow = document.getElementById('bikeShadow');

    // Rig Constants
    const BB = { x: 475, y: 435 };       // Bottom Bracket (crank axle)
    const CRANK_R = 34;                 // Crank arm radius (px)
    const HIP_BASE = { x: 452, y: 320 }; // Base hip joint
    const L1 = 70;                      // Thigh length (Hip to Knee)
    const L2 = 68;                      // Shin length (Knee to Ankle)

    /**
     * 2-Bone Inverse Kinematics (IK) Solver
     * Solves for Knee joint (kx, ky) given Hip (hx, hy) and Pedal/Target (px, py)
     * bendDir = 1 points knee forward
     */
    function solveIK(hx, hy, px, py, l1, l2, bendDir = 1) {
      const dx = px - hx;
      const dy = py - hy;
      let d = Math.hypot(dx, dy);

      // Clamp distance within reachable kinematic envelope
      const maxReach = l1 + l2 - 0.5;
      const minReach = Math.abs(l1 - l2) + 0.5;
      if (d > maxReach) d = maxReach;
      if (d < minReach) d = minReach;

      // Base angle between hip and pedal
      const phi = Math.atan2(dy, dx);

      // Law of Cosines: find angle alpha at hip inside triangle
      const cosAlpha = (l1 * l1 + d * d - l2 * l2) / (2 * l1 * d);
      const alpha = Math.acos(Math.max(-1, Math.min(1, cosAlpha)));

      // Knee position
      const kneeAngle = phi - bendDir * alpha;
      const kx = hx + l1 * Math.cos(kneeAngle);
      const ky = hy + l1 * Math.sin(kneeAngle);

      return { kx, ky, d, phi };
    }

    /**
     * Build SVG markup for pelican's webbed foot on pedal
     */
    function renderWebbedFoot(targetGroup, pedalX, pedalY, isFront = true) {
      const footColor = isFront ? '#f97316' : '#ea580c';
      const webColor = isFront ? '#fbbf24' : '#f59e0b';
      const pedalColor = '#1e293b';

      targetGroup.innerHTML = `
        <!-- Pedal platform -->
        <rect x="${pedalX - 16}" y="${pedalY - 3}" width="32" height="6" rx="2" fill="${pedalColor}" stroke="#64748b" stroke-width="1"/>
        <rect x="${pedalX - 14}" y="${pedalY - 2}" width="28" height="2" fill="#94a3b8"/>
        <!-- Ankle Joint -->
        <circle cx="${pedalX}" cy="${pedalY - 4}" r="4.5" fill="${footColor}"/>
        <!-- Webbed Foot Toes -->
        <!-- Heel -->
        <path d="M ${pedalX - 8},${pedalY - 4} Q ${pedalX - 14},${pedalY - 2} ${pedalX - 10},${pedalY}" stroke="${footColor}" stroke-width="4" stroke-linecap="round" fill="none"/>
        <!-- Main Webbed Membrane -->
        <polygon points="${pedalX - 6},${pedalY - 2} ${pedalX + 16},${pedalY - 4} ${pedalX + 19},${pedalY} ${pedalX + 16},${pedalY + 3} ${pedalX - 4},${pedalY}" fill="${webColor}" opacity="0.9"/>
        <!-- Three Claws/Toes -->
        <line x1="${pedalX - 4}" y1="${pedalY - 2}" x2="${pedalX + 16}" y2="${pedalY - 4}" stroke="${footColor}" stroke-width="3" stroke-linecap="round"/>
        <line x1="${pedalX - 4}" y1="${pedalY}" x2="${pedalX + 19}" y2="${pedalY}" stroke="${footColor}" stroke-width="3.5" stroke-linecap="round"/>
        <line x1="${pedalX - 4}" y1="${pedalY + 2}" x2="${pedalX + 16}" y2="${pedalY + 3}" stroke="${footColor}" stroke-width="3" stroke-linecap="round"/>
      `;
    }

    /* =========================================================================
       3. ANIMATION STATE & LOOP
       ========================================================================= */
    let isPlaying = true;
    let speedNormalized = 0.35; // 0.0 to 1.0 (mapped from slider 0-100)
    let crankAngle = 0;         // radians
    let wheelAngle = 0;         // degrees
    let sceneryPos = 0;         // px
    let pouchJiggleTime = 0;
    let blinkTimer = 0;
    let isBlinking = false;
    let fishFedPulse = 0;

    // Mileage & Status tracking
    let odometerKm = 12.8;
    let lastTimestamp = performance.now();

    function updateSimulation(dt) {
      if (!isPlaying) return;

      // Actual speed calculations
      // 0 slider = 0 km/h, 35 slider = 24 km/h, 100 slider = 70 km/h
      const kmh = speedNormalized * 70;
      const cadenceRpm = speedNormalized * 95; // Cadence in RPM
      const crankSpeedRad = (cadenceRpm / 60) * (2 * Math.PI); // rad/sec

      crankAngle += crankSpeedRad * dt;
      wheelAngle = (wheelAngle + kmh * 15 * dt) % 360;
      sceneryPos += kmh * 18 * dt;
      odometerKm += (kmh * dt) / 3600;

      // Update HUD Displays
      document.getElementById('speedBadge').textContent = `${kmh.toFixed(1)} km/h`;
      document.getElementById('cadenceBadge').textContent = `${Math.round(cadenceRpm)} RPM`;

      // 1. Rotate Wheels
      rearSpokesGroup.setAttribute('transform', `rotate(${wheelAngle})`);
      frontSpokesGroup.setAttribute('transform', `rotate(${wheelAngle})`);

      // 2. Parallax Scenery Updates
      // Clouds
      clouds.forEach((c, idx) => {
        const cx = (c.x - sceneryPos * c.speed * 0.08) % 1200;
        const drawX = cx < -120 ? cx + 1200 : cx;
        c.element.setAttribute('transform', `translate(${drawX}, ${c.y}) scale(${c.scale})`);
      });

      // Mountains
      mountains.forEach((m, idx) => {
        const offset = (sceneryPos * (idx === 0 ? 0.04 : 0.08)) % 1000;
        m.el1.setAttribute('transform', `translate(${-offset}, 0)`);
        m.el2.setAttribute('transform', `translate(${1000 - offset}, 0)`);
      });

      // Waves
      waves.forEach((w, idx) => {
        const wx = (w.baseX - sceneryPos * 0.4) % 1100;
        const drawX = wx < -100 ? wx + 1100 : wx;
        const waveBob = Math.sin(crankAngle * 2 + idx) * 3;
        w.el.setAttribute('d', `M ${drawX},${w.y + waveBob} Q ${drawX + w.length/2},${w.y - 6 + waveBob} ${drawX + w.length},${w.y + waveBob}`);
      });

      // Road Posts & Rope
      let ropePoints = '';
      sceneryItems.forEach((item, idx) => {
        const ix = (item.x - sceneryPos * 1.4) % 1200;
        const drawX = ix < -50 ? ix + 1200 : ix;
        item.el.setAttribute('transform', `translate(${drawX}, 0)`);
        if (idx === 0) ropePoints += `M ${drawX + 4},394 `;
        else ropePoints += `Q ${drawX - 35},404 ${drawX + 4},394 `;
      });
      ropePath.setAttribute('d', ropePoints);

      // Palm trees
      palmTrees.forEach((pt, idx) => {
        const px = (pt.x - sceneryPos * 1.4) % 1400;
        const drawX = px < -150 ? px + 1400 : px;
        pt.el.setAttribute('transform', `translate(${drawX}, 0)`);
      });

      // Road Stripes
      roadStripes.forEach((rs, idx) => {
        const rx = (rs.x - sceneryPos * 3.2) % 1190;
        const drawX = rx < -70 ? rx + 1190 : rx;
        rs.el.setAttribute('x', drawX);
      });

      // Foreground Pebbles
      pebbles.forEach((pb, idx) => {
        const px = (pb.x - sceneryPos * 4.2) % 1100;
        const drawX = px < -30 ? px + 1100 : px;
        pb.el.setAttribute('cx', drawX);
      });

      // Speed lines when sprinting (> 35 km/h)
      if (kmh > 35) {
        speedLinesGroup.setAttribute('opacity', Math.min(1, (kmh - 35) / 25));
        speedLines.forEach(sl => {
          sl.x -= (kmh * 35 + 200) * dt;
          if (sl.x < -150) sl.x = 1050 + Math.random() * 200;
          sl.el.setAttribute('x1', sl.x);
          sl.el.setAttribute('x2', sl.x + sl.len);
        });
      } else {
        speedLinesGroup.setAttribute('opacity', '0');
      }

      // ==========================================================
      // 3. PELICAN KINEMATICS & PEDALING RIG CALCULATION
      // ==========================================================
      // Natural body bobbing synced with cadence: double frequency
      const bobAmount = speedNormalized > 0.02 ? Math.sin(crankAngle * 2) * 5.5 : 0;
      const forwardLean = speedNormalized * 6; // Leans forward more at high speed
      const hipX = HIP_BASE.x + forwardLean * 0.5;
      const hipY = HIP_BASE.y + bobAmount;

      // Crank & Pedal positions
      // Left/Front pedal at crankAngle
      const frontPedalX = BB.x + CRANK_R * Math.cos(crankAngle);
      const frontPedalY = BB.y + CRANK_R * Math.sin(crankAngle);
      // Right/Back pedal at crankAngle + PI (180 deg offset)
      const backPedalX = BB.x + CRANK_R * Math.cos(crankAngle + Math.PI);
      const backPedalY = BB.y + CRANK_R * Math.sin(crankAngle + Math.PI);

      // Render Crank Arms
      crankGroup.innerHTML = `
        <!-- Crank Arm to Front Pedal -->
        <line x1="${BB.x}" y1="${BB.y}" x2="${frontPedalX}" y2="${frontPedalY}" stroke="#94a3b8" stroke-width="7" stroke-linecap="round"/>
        <circle cx="${frontPedalX}" cy="${frontPedalY}" r="4.5" fill="#475569"/>
        <!-- Crank Arm to Back Pedal -->
        <line x1="${BB.x}" y1="${BB.y}" x2="${backPedalX}" y2="${backPedalY}" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
      `;

      // Solve 2-Bone IK for Front Leg
      const frontIK = solveIK(hipX, hipY, frontPedalX, frontPedalY, L1, L2, 1);
      frontThigh.setAttribute('d', `M ${hipX},${hipY} Q ${(hipX + frontIK.kx)/2 - 5},${(hipY + frontIK.ky)/2} ${frontIK.kx},${frontIK.ky}`);
      frontShin.setAttribute('d', `M ${frontIK.kx},${frontIK.ky} L ${frontPedalX},${frontPedalY - 4}`);
      frontKneeCap.setAttribute('cx', frontIK.kx);
      frontKneeCap.setAttribute('cy', frontIK.ky);
      renderWebbedFoot(frontFootGroup, frontPedalX, frontPedalY, true);

      // Solve 2-Bone IK for Back Leg
      const backIK = solveIK(hipX - 10, hipY, backPedalX, backPedalY, L1, L2, 1);
      backThigh.setAttribute('d', `M ${hipX - 10},${hipY} L ${backIK.kx},${backIK.ky}`);
      backShin.setAttribute('d', `M ${backIK.kx},${backIK.ky} L ${backPedalX},${backPedalY - 4}`);
      renderWebbedFoot(backFootGroup, backPedalX, backPedalY, false);

      // Bobbing & Breathing transformations for Pelican Upper Body
      const bodyTilt = (Math.sin(crankAngle) * 2.2 + forwardLean * 0.8).toFixed(2);
      pelicanTorso.setAttribute('transform', `translate(0, ${bobAmount}) rotate(${bodyTilt} 475 320)`);
      pelicanNeck.setAttribute('transform', `translate(0, ${bobAmount * 0.8}) rotate(${bodyTilt * 0.6} 540 250)`);
      pelicanHead.setAttribute('transform', `translate(0, ${bobAmount * 0.7})`);
      document.getElementById('cyclingCap').setAttribute('transform', `translate(0, ${bobAmount * 0.7})`);
      document.getElementById('pelicanTail').setAttribute('transform', `translate(0, ${bobAmount})`);
      document.getElementById('pelicanWingBase').setAttribute('transform', `translate(0, ${bobAmount}) rotate(${bodyTilt * 0.5} 490 290)`);

      // Eye Blinking logic
      blinkTimer += dt;
      if (blinkTimer > 3.5 && !isBlinking) {
        isBlinking = true;
        eyelid.setAttribute('stroke-width', '5');
        setTimeout(() => {
          eyelid.setAttribute('stroke-width', '0');
          isBlinking = false;
          blinkTimer = 0;
        }, 150);
      }
      eyePupil.setAttribute('transform', `translate(0, ${bobAmount * 0.7})`);
      eyelid.setAttribute('transform', `translate(0, ${bobAmount * 0.7})`);

      // Pouch elastic jiggle
      pouchJiggleTime += dt * (4 + speedNormalized * 12);
      const pouchBounce = Math.sin(pouchJiggleTime) * (2 + speedNormalized * 5) + (fishFedPulse > 0 ? Math.sin(fishFedPulse * 15) * 12 : 0);
      const pouchDrop = (210 + bobAmount * 0.7 + pouchBounce).toFixed(1);
      const pouchWidth = (650 + forwardLean * 0.8).toFixed(1);
      
      upperBill.setAttribute('transform', `translate(0, ${bobAmount * 0.7})`);
      throatPouch.setAttribute('d', `M 570,${166 + bobAmount * 0.7} Q 600,${pouchDrop} ${pouchWidth},${pouchDrop - 15} Q 710,${195 + bobAmount * 0.7} 721,${173 + bobAmount * 0.7} C 670,${172 + bobAmount * 0.7} 620,${165 + bobAmount * 0.7} 570,${166 + bobAmount * 0.7} Z`);
      
      // Fish inside pouch jiggle
      if (fishInPouch) {
        const fishY = 185 + bobAmount * 0.7 + pouchBounce * 0.6;
        const fishRot = -15 + Math.sin(pouchJiggleTime * 1.5) * 8;
        fishInPouch.setAttribute('transform', `translate(635, ${fishY}) rotate(${fishRot}) scale(${1 + (fishFedPulse > 0 ? 0.35 : 0)})`);
      }

      if (fishFedPulse > 0) {
        fishFedPulse -= dt * 2.5;
        if (fishFedPulse < 0) fishFedPulse = 0;
      }

      // Fluttering Red Scarf
      const scarfFreq = 8 + speedNormalized * 22;
      const sWave1 = Math.sin(crankAngle * 3 + pouchJiggleTime * 0.8) * (8 + speedNormalized * 16);
      const sWave2 = Math.cos(crankAngle * 3.5 + pouchJiggleTime) * (6 + speedNormalized * 14);
      const scarfXTip = 445 - speedNormalized * 40;
      scarfTail1.setAttribute('d', `M 536,${227 + bobAmount * 0.8} Q 495,${225 + bobAmount * 0.8 + sWave1 * 0.5} ${scarfXTip},${205 + bobAmount * 0.8 + sWave1} Q 490,${238 + bobAmount * 0.8} 534,${233 + bobAmount * 0.8} Z`);
      scarfTail2.setAttribute('d', `M 538,${230 + bobAmount * 0.8} Q 500,${240 + bobAmount * 0.8 + sWave2 * 0.5} ${scarfXTip + 15},${228 + bobAmount * 0.8 + sWave2} Q 495,${252 + bobAmount * 0.8} 536,${236 + bobAmount * 0.8} Z`);

      // Dynamic wing arm flexion
      const elbowX = 550 + forwardLean * 0.3;
      const elbowY = 272 + bobAmount * 0.6;
      pelicanWingArm.setAttribute('d', `M 505,${280 + bobAmount} Q ${elbowX},${elbowY} 603,285`);

      // Ground shadow expands/contracts slightly
      bikeShadow.setAttribute('rx', (170 + forwardLean * 2).toFixed(1));
    }

    function animLoop(timestamp) {
      const dt = Math.min((timestamp - lastTimestamp) / 1000, 0.1); // Clamp to max 100ms
      lastTimestamp = timestamp;

      updateSimulation(dt);
      requestAnimationFrame(animLoop);
    }
    requestAnimationFrame(animLoop);

    /* =========================================================================
       4. INTERACTION CONTROLS & SPEED SLIDER
       ========================================================================= */
    const speedSlider = document.getElementById('speedSlider');
    const speedMultiplierText = document.getElementById('speedMultiplierText');
    const statusDot = document.getElementById('statusDot');
    const btnPlayPause = document.getElementById('btnPlayPause');
    const playIcon = document.getElementById('playIcon');
    const playText = document.getElementById('playText');

    function updateSpeed(val) {
      speedNormalized = val / 100;
      speedSlider.value = val;

      // Update text label
      if (val == 0) {
        speedMultiplierText.textContent = "0.0x 停下休息";
        speedMultiplierText.className = "text-sm font-black font-mono px-2 py-0.5 rounded-md bg-slate-200 text-slate-700";
        statusDot.className = "w-2.5 h-2.5 rounded-full bg-slate-400";
      } else if (val < 25) {
        speedMultiplierText.textContent = `${(val/35).toFixed(1)}x 悠闲漫游`;
        speedMultiplierText.className = "text-sm font-black font-mono px-2 py-0.5 rounded-md bg-emerald-100 text-emerald-700";
        statusDot.className = "w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse";
      } else if (val <= 50) {
        speedMultiplierText.textContent = `${(val/35).toFixed(1)}x 标准巡航`;
        speedMultiplierText.className = "text-sm font-black font-mono px-2 py-0.5 rounded-md bg-sky-100 text-sky-700";
        statusDot.className = "w-2.5 h-2.5 rounded-full bg-sky-500 animate-pulse";
      } else if (val <= 80) {
        speedMultiplierText.textContent = `${(val/35).toFixed(1)}x 强力冲刺`;
        speedMultiplierText.className = "text-sm font-black font-mono px-2 py-0.5 rounded-md bg-amber-100 text-amber-700";
        statusDot.className = "w-2.5 h-2.5 rounded-full bg-amber-500 animate-ping";
      } else {
        speedMultiplierText.textContent = `${(val/35).toFixed(1)}x 超音速狂飙`;
        speedMultiplierText.className = "text-sm font-black font-mono px-2 py-0.5 rounded-md bg-red-100 text-red-700 animate-bounce";
        statusDot.className = "w-2.5 h-2.5 rounded-full bg-red-500 animate-ping";
      }

      // Highlight corresponding preset button if matching
      document.querySelectorAll('.preset-btn').forEach(btn => {
        btn.classList.remove('bg-sky-500', 'text-white');
      });
    }

    speedSlider.addEventListener('input', (e) => {
      if (!isPlaying) togglePlayPause();
      updateSpeed(parseFloat(e.target.value));
    });

    function setSpeedPreset(val) {
      if (!isPlaying) togglePlayPause();
      updateSpeed(val);
    }

    function togglePlayPause() {
      isPlaying = !isPlaying;
      if (isPlaying) {
        playIcon.textContent = '⏸️';
        playText.textContent = '暂停';
        btnPlayPause.classList.replace('bg-emerald-600', 'bg-slate-800');
        btnPlayPause.classList.replace('hover:bg-emerald-500', 'hover:bg-slate-700');
        statusDot.className = "w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse";
        lastTimestamp = performance.now();
      } else {
        playIcon.textContent = '▶️';
        playText.textContent = '继续骑行';
        btnPlayPause.classList.replace('bg-slate-800', 'bg-emerald-600');
        btnPlayPause.classList.replace('hover:bg-slate-700', 'hover:bg-emerald-500');
        statusDot.className = "w-2.5 h-2.5 rounded-full bg-amber-400";
      }
    }

    /* =========================================================================
       5. WEB AUDIO API SYNTHESIZER: REALISTIC BIKE BELL DING
       ========================================================================= */
    let audioCtx = null;

    function ringBikeBell() {
      // Trigger toast notice
      const toast = document.getElementById('bellToast');
      toast.classList.remove('opacity-0', 'translate-y-[-10px]');
      toast.classList.add('opacity-100', 'translate-y-0');
      setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', 'translate-y-[-10px]');
      }, 1600);

      // Bell visual bounce
      const bell = document.getElementById('bikeBell');
      bell.setAttribute('fill', '#fde047');
      setTimeout(() => bell.setAttribute('fill', '#e2e8f0'), 300);

      // Synthesize realistic dual-frequency metallic chime
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }

        const now = audioCtx.currentTime;
        const freqs = [2100, 2650]; // Distinct high pitched dual chime of bicycle bells

        freqs.forEach((freq, i) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();

          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + i * 0.08);
          // Slight frequency decay like real metal
          osc.frequency.exponentialRampToValueAtTime(freq * 0.98, now + i * 0.08 + 0.4);

          gain.gain.setValueAtTime(0, now + i * 0.08);
          gain.gain.linearRampToValueAtTime(0.3, now + i * 0.08 + 0.01);
          gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.5);

          osc.connect(gain);
          gain.connect(audioCtx.destination);

          osc.start(now + i * 0.08);
          osc.stop(now + i * 0.08 + 0.6);
        });
      } catch (e) {
        console.log("Audio not allowed or supported:", e);
      }
    }

    document.getElementById('bikeBell').addEventListener('click', ringBikeBell);

    // Feed Fish interaction
    function feedFish() {
      fishFedPulse = 1.0;
      const toast = document.getElementById('fishToast');
      toast.classList.remove('opacity-0', 'translate-y-[-10px]');
      toast.classList.add('opacity-100', 'translate-y-0');
      setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', 'translate-y-[-10px]');
      }, 1600);
    }

    /* =========================================================================
       6. THEME SWITCHER (DAY / SUNSET / NIGHT)
       ========================================================================= */
    function setTheme(theme) {
      const html = document.documentElement;
      const body = document.getElementById('mainBody');
      const title = document.getElementById('titleText');
      const subtitle = document.getElementById('subtitleText');
      const celestial = document.getElementById('celestialBody');

      // Update button highlights
      ['btnThemeDay', 'btnThemeSunset', 'btnThemeNight'].forEach(id => {
        const btn = document.getElementById(id);
        btn.className = "px-2.5 py-1 text-xs rounded-lg font-medium transition-all text-slate-600 hover:bg-slate-100";
      });

      if (theme === 'day') {
        html.removeAttribute('data-theme');
        body.className = "bg-slate-100 text-slate-800 min-h-screen flex flex-col items-center justify-between p-3 sm:p-6 select-none transition-colors duration-500";
        title.className = "text-xl sm:text-2xl font-black tracking-tight text-slate-800";
        subtitle.className = "text-xs sm:text-sm text-slate-500";
        celestial.setAttribute('fill', '#fef08a');
        celestial.setAttribute('filter', 'drop-shadow(0 0 16px rgba(254, 240, 138, 0.8))');
        document.getElementById('btnThemeDay').className = "px-2.5 py-1 text-xs rounded-lg font-medium transition-all bg-sky-100 text-sky-700";
      } else if (theme === 'sunset') {
        html.setAttribute('data-theme', 'sunset');
        body.className = "bg-orange-950/20 text-slate-800 min-h-screen flex flex-col items-center justify-between p-3 sm:p-6 select-none transition-colors duration-500";
        title.className = "text-xl sm:text-2xl font-black tracking-tight text-orange-950";
        subtitle.className = "text-xs sm:text-sm text-orange-800/80";
        celestial.setAttribute('fill', '#f43f5e');
        celestial.setAttribute('filter', 'drop-shadow(0 0 24px rgba(244, 63, 94, 0.9))');
        document.getElementById('btnThemeSunset').className = "px-2.5 py-1 text-xs rounded-lg font-medium transition-all bg-orange-200 text-orange-800";
      } else if (theme === 'night') {
        html.setAttribute('data-theme', 'night');
        body.className = "bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-between p-3 sm:p-6 select-none transition-colors duration-500";
        title.className = "text-xl sm:text-2xl font-black tracking-tight text-slate-100";
        subtitle.className = "text-xs sm:text-sm text-slate-400";
        celestial.setAttribute('fill', '#f8fafc');
        celestial.setAttribute('filter', 'drop-shadow(0 0 20px rgba(248, 250, 252, 0.9))');
        document.getElementById('btnThemeNight').className = "px-2.5 py-1 text-xs rounded-lg font-medium transition-all bg-indigo-950 text-indigo-300 border border-indigo-700/50";
      }
    }

    // Keyboard accessibility shortcuts
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        togglePlayPause();
      } else if (e.code === 'ArrowRight' || e.code === 'ArrowUp') {
        e.preventDefault();
        const newVal = Math.min(100, parseInt(speedSlider.value) + 5);
        updateSpeed(newVal);
      } else if (e.code === 'ArrowLeft' || e.code === 'ArrowDown') {
        e.preventDefault();
        const newVal = Math.max(0, parseInt(speedSlider.value) - 5);
        updateSpeed(newVal);
      } else if (e.key === 'b' || e.key === 'B') {
        ringBikeBell();
      } else if (e.key === 'f' || e.key === 'F') {
        feedFish();
      }
    });
  </script>
</body>
