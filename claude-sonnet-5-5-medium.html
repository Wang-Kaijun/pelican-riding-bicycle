<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pelican on a Bicycle</title>
<style>
  body { margin:0; font-family:system-ui,sans-serif; background:#cfeaf7; display:flex; flex-direction:column; align-items:center; min-height:100vh; }
  svg { width:100%; max-width:900px; height:auto; display:block; }
  .controls { background:#fff; padding:12px 20px; border-radius:12px; margin:12px; box-shadow:0 2px 8px #0002; display:flex; gap:12px; align-items:center; }
  input[type=range] { width:240px; }
</style>
</head>
<body>
<svg id="scene" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd0f5"/><stop offset="1" stop-color="#e6f6ff"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#sky)"/>
  <circle cx="680" cy="80" r="40" fill="#ffe27a"/>

  <!-- clouds -->
  <g id="clouds" fill="#fff" opacity=".9">
    <g class="cloud" data-x="100" data-s="0.15"><ellipse cx="0" cy="90" rx="50" ry="18"/><ellipse cx="25" cy="78" rx="30" ry="18"/></g>
    <g class="cloud" data-x="450" data-s="0.1"><ellipse cx="0" cy="140" rx="60" ry="20"/><ellipse cx="-25" cy="128" rx="32" ry="18"/></g>
  </g>

  <!-- ground -->
  <rect y="360" width="800" height="90" fill="#7cc06b"/>
  <rect y="352" width="800" height="14" fill="#5a5a66"/>
  <g id="road" stroke="#fff" stroke-width="3" stroke-dasharray="30 30"><line x1="-60" y1="359" x2="900" y2="359"/></g>

  <!-- bicycle + pelican, bobbing together -->
  <g id="rider">
    <!-- rear wheel -->
    <g transform="translate(250 310)">
      <g class="wheel">
        <circle r="50" fill="none" stroke="#222" stroke-width="6"/>
        <g stroke="#888" stroke-width="1.5">
          <line x1="-50" y1="0" x2="50" y2="0"/><line y1="-50" x2="0" y2="50"/>
          <line x1="-35" y1="-35" x2="35" y2="35"/><line x1="-35" y1="35" x2="35" y2="-35"/>
        </g>
        <circle r="5" fill="#444"/>
      </g>
    </g>
    <!-- front wheel -->
    <g transform="translate(520 310)">
      <g class="wheel">
        <circle r="50" fill="none" stroke="#222" stroke-width="6"/>
        <g stroke="#888" stroke-width="1.5">
          <line x1="-50" y1="0" x2="50" y2="0"/><line y1="-50" x2="0" y2="50"/>
          <line x1="-35" y1="-35" x2="35" y2="35"/><line x1="-35" y1="35" x2="35" y2="-35"/>
        </g>
        <circle r="5" fill="#444"/>
      </g>
    </g>

    <!-- frame: rear hub(250,310) BB(370,310) seat(330,225) head(490,225) front hub(520,310) -->
    <g stroke="#d6362b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <polyline points="250,310 370,310 330,225 250,310"/>
      <line x1="330" y1="225" x2="490" y2="225"/>
      <line x1="370" y1="310" x2="490" y2="225"/>
      <line x1="490" y1="225" x2="520" y2="310"/>
    </g>
    <!-- seat & handlebar -->
    <rect x="310" y="212" width="42" height="9" rx="4" fill="#222"/>
    <line x1="490" y1="225" x2="490" y2="200" stroke="#333" stroke-width="6" stroke-linecap="round"/>
    <path d="M478 198 Q500 190 512 200" stroke="#333" stroke-width="6" fill="none" stroke-linecap="round"/>

    <!-- chainring + pedals -->
    <circle cx="370" cy="310" r="16" fill="none" stroke="#444" stroke-width="4"/>
    <g id="crank" transform="translate(370 310)">
      <line x1="0" y1="0" x2="0" y2="38" stroke="#333" stroke-width="5" stroke-linecap="round"/>
      <rect id="pedalA" x="-10" y="36" width="20" height="6" rx="3" fill="#222"/>
      <line x1="0" y1="0" x2="0" y2="-38" stroke="#333" stroke-width="5" stroke-linecap="round"/>
      <rect id="pedalB" x="-10" y="-42" width="20" height="6" rx="3" fill="#222"/>
    </g>

    <!-- PELICAN -->
    <g id="pelican">
      <!-- tail -->
      <path d="M300 180 L262 205 L300 212 Z" fill="#b9c3cc"/>
      <!-- back leg (drawn by JS) -->
      <g id="legBack" stroke="#f2a33a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <polyline id="legBackLine" points="0,0 0,0 0,0"/>
      </g>
      <!-- body -->
      <ellipse cx="350" cy="180" rx="62" ry="42" fill="#f4f6f8" stroke="#c6ced6" stroke-width="2"/>
      <!-- wing -->
      <path d="M320 168 Q365 150 400 190 Q360 215 315 195 Z" fill="#cfd8df" stroke="#a9b4be" stroke-width="2"/>
      <!-- neck -->
      <path d="M385 160 Q430 140 420 105 Q415 85 435 78" stroke="#f4f6f8" stroke-width="22" fill="none" stroke-linecap="round"/>
      <path d="M385 160 Q430 140 420 105 Q415 85 435 78" stroke="#c6ced6" stroke-width="2" fill="none" stroke-linecap="round" transform="translate(-11 0)" opacity=".0"/>
      <!-- head -->
      <circle cx="440" cy="76" r="18" fill="#f4f6f8" stroke="#c6ced6" stroke-width="2"/>
      <!-- beak -->
      <path d="M452 72 L540 84 L452 92 Z" fill="#f5a623" stroke="#c9821a" stroke-width="2" stroke-linejoin="round"/>
      <path d="M452 86 Q500 118 536 88 L452 90 Z" fill="#f7c35f" stroke="#c9821a" stroke-width="2" stroke-linejoin="round"/>
      <!-- eye -->
      <circle cx="446" cy="70" r="4" fill="#111"/><circle cx="447.3" cy="68.8" r="1.3" fill="#fff"/>
      <!-- helmet -->
      <path d="M421 72 Q425 48 448 52 Q460 56 460 66 Z" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2"/>
      <!-- arm to handlebar -->
      <path d="M390 172 Q450 180 500 200" stroke="#cfd8df" stroke-width="9" fill="none" stroke-linecap="round"/>
      <!-- front leg -->
      <g id="legFront" stroke="#f2a33a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <polyline id="legFrontLine" points="0,0 0,0 0,0"/>
      </g>
    </g>
  </g>
</svg>

<div class="controls">
  <label for="speed">🚲 Riding speed</label>
  <input id="speed" type="range" min="0" max="10" step="0.1" value="3">
  <output id="out">3.0×</output>
</div>

<script>
(() => {
  const slider = document.getElementById('speed');
  const out = document.getElementById('out');
  const wheels = [...document.querySelectorAll('.wheel')];
  const crank = document.getElementById('crank');
  const pedalA = document.getElementById('pedalA');
  const pedalB = document.getElementById('pedalB');
  const road = document.getElementById('road').firstElementChild;
  const rider = document.getElementById('rider');
  const clouds = [...document.querySelectorAll('.cloud')];
  const legF = document.getElementById('legFrontLine');
  const legB = document.getElementById('legBackLine');

  const HIP_F = [355, 212], HIP_B = [335, 212];
  const THIGH = 52, SHIN = 62;
  const BB = [370, 310], CR = 38;

  // two-bone IK: returns knee position, knee bends forward
  function knee(hip, foot) {
    let dx = foot[0]-hip[0], dy = foot[1]-hip[1];
    let d = Math.min(Math.hypot(dx, dy), THIGH+SHIN-0.01);
    const a = (THIGH*THIGH - SHIN*SHIN + d*d) / (2*d);
    const h = Math.sqrt(Math.max(0, THIGH*THIGH - a*a));
    const ux = dx/Math.hypot(dx,dy), uy = dy/Math.hypot(dx,dy);
    return [hip[0] + ux*a + uy*h, hip[1] + uy*a - ux*h];
  }
  function setLeg(el, hip, foot) {
    const k = knee(hip, foot);
    el.setAttribute('points', `${hip} ${k} ${foot}`);
  }

  let angle = 0, last = performance.now(), roadOff = 0, t = 0;
  const cloudX = clouds.map(c => +c.dataset.x);

  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05); last = now;
    const speed = +slider.value;
    angle += speed * 180 * dt;                // pedal deg
    roadOff -= speed * 180 * dt * (Math.PI*50/180) ; // px, wheel radius 50 (rolling)
    t += dt * speed;

    wheels.forEach(w => w.setAttribute('transform', `rotate(${angle})`));
    crank.setAttribute('transform', `translate(${BB}) rotate(${angle})`);
    // keep pedals level
    const rad = angle * Math.PI/180;
    const pA = [BB[0] - Math.sin(rad)*CR, BB[1] + Math.cos(rad)*CR];
    const pB = [BB[0] + Math.sin(rad)*CR, BB[1] - Math.cos(rad)*CR];
    pedalA.setAttribute('transform', `rotate(${-angle} 0 39) translate(0 0)`);
    pedalB.setAttribute('transform', `rotate(${-angle} 0 -39)`);
    setLeg(legF, HIP_F, [pA[0]+2, pA[1]+2]);
    setLeg(legB, HIP_B, [pB[0]+2, pB[1]+2]);

    road.setAttribute('stroke-dashoffset', roadOff);
    const bob = Math.sin(rad*2) * Math.min(speed,6) * 0.4;
    rider.setAttribute('transform', `translate(0 ${bob})`);

    clouds.forEach((c, i) => {
      cloudX[i] -= (8 + speed*10) * +c.dataset.s * dt * 6;
      if (cloudX[i] < -120) cloudX[i] = 920;
      c.setAttribute('transform', `translate(${cloudX[i]} 0)`);
    });
    requestAnimationFrame(frame);
  }
  slider.addEventListener('input', () => out.textContent = (+slider.value).toFixed(1) + '×');
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
