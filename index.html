<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(180deg, #dceefb 0%, #eef7e9 100%);
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    padding: 32px 20px 48px;
  }
  header { text-align: center; margin-bottom: 28px; }
  h1 {
    margin: 0 0 8px;
    font-size: 30px;
    color: #2c3e50;
    letter-spacing: 2px;
  }
  header p { margin: 0; color: #6b7f92; font-size: 15px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(460px, 1fr));
    gap: 24px;
    max-width: 1500px;
    margin: 0 auto;
  }
  .item {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(30, 60, 90, 0.12);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .item header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 18px;
    margin: 0;
    border-bottom: 1px solid #edf1f5;
  }
  .item h2 { margin: 0; font-size: 17px; color: #34495e; }
  .item a {
    font-size: 14px;
    color: #e74c3c;
    text-decoration: none;
    white-space: nowrap;
  }
  .item a:hover { text-decoration: underline; }
  .frame-wrap { position: relative; width: 100%; height: 780px; }
  .frame-wrap iframe {
    position: absolute;
    top: -35px;
    left: 0;
    width: 100%;
    height: 850px;
    border: 0;
    transform-origin: top left;
  }
  footer {
    text-align: center;
    margin-top: 32px;
    color: #8aa0b4;
    font-size: 13px;
  }
  footer a { color: #5d7a94; }
  @media (max-width: 1020px) {
    .frame-wrap { height: 720px; }
    .frame-wrap iframe { height: 790px; }
  }
</style>
</head>
