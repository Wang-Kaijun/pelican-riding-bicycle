<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>鹈鹕骑自行车 · SVG 动画</title>
<style>
  :root{ color-scheme: dark; }
  html,body{ margin:0; min-height:100%; }
  body{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:18px; padding:32px 16px; box-sizing:border-box; min-height:100vh;
    background:radial-gradient(130% 110% at 50% 0%, #2c3e57 0%, #151c28 55%, #0d1219 100%);
    font-family:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:#c9d6e5;
  }
  .stage{
    width:min(96vw,1080px); border-radius:22px; overflow:hidden;
    box-shadow:0 40px 80px -28px rgba(0,0,0,.9), 0 0 0 1px rgba(255,255,255,.09);
  }
  svg{ display:block; width:100%; height:auto; background:#a9e2f3; }

  /* ---------- 速度控制条 ---------- */
  .panel{
    width:min(96vw,1080px); box-sizing:border-box;
    display:flex; align-items:center; gap:16px; flex-wrap:wrap;
    padding:14px 20px; border-radius:16px;
    background:rgba(255,255,255,.055);
    border:1px solid rgba(255,255,255,.10);
    box-shadow:0 18px 40px -26px rgba(0,0,0,.9);
    font-size:13px; letter-spacing:.05em;
  }
  .panel .tag{ font-weight:600; color:#7fe3d6; white-space:nowrap; }
  .panel .tag::before{ content:"▶"; margin-right:8px; font-size:10px; opacity:.8; }

  #speed{
    -webkit-appearance:none; appearance:none;
    flex:1 1 260px; min-width:180px; height:6px; margin:0;
    border-radius:999px; outline:none; cursor:pointer;
    background:linear-gradient(90deg,#2ec4b6 0 var(--p,33%),rgba(255,255,255,.15) var(--p,33%) 100%);
  }
  #speed:focus-visible{ box-shadow:0 0 0 3px rgba(46,196,182,.35); }
  #speed::-webkit-slider-thumb{
    -webkit-appearance:none; width:20px; height:20px; border-radius:50%;
    background:#ffd43b; border:3px solid #16202c; cursor:grab;
    box-shadow:0 0 0 1px rgba(255,212,59,.55), 0 4px 12px rgba(0,0,0,.55);
    transition:transform .12s ease;
  }
  #speed:active::-webkit-slider-thumb{ cursor:grabbing; transform:scale(1.14); }
  #speed::-moz-range-thumb{
    width:14px; height:14px; border-radius:50%;
    background:#ffd43b; border:3px solid #16202c; cursor:grab;
    box-shadow:0 0 0 1px rgba(255,212,59,.55), 0 4px 12px rgba(0,0,0,.55);
  }
  #speed::-moz-range-track{ height:6px; border-radius:999px; background:transparent; }

  .readout{
    display:flex; align-items:baseline; gap:10px; white-space:nowrap;
    font-variant-numeric:tabular-nums;
  }
  #mult{ font-weight:700; font-size:15px; color:#ffd43b; min-width:4.4em; }
  #kmh{ opacity:.6; font-size:12px; }

  .reset{
    font:inherit; letter-spacing:.05em; cursor:pointer;
    padding:7px 14px; border-radius:999px; color:#c9d6e5;
    background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.14);
    transition:background .15s ease, color .15s ease;
  }
  .reset:hover{ background:rgba(255,255,255,.14); color:#fff; }
  .reset:active{ transform:translateY(1px); }

  .caption{ font-size:13px; letter-spacing:.08em; opacity:.5; text-align:center; }
  .caption b{ color:#ffd43b; font-weight:600; }
  @media (prefers-reduced-motion: reduce){ .reset:active{ transform:none; } }
</style>
</head>

<div class="panel">
  <span class="tag" id="lbl">骑行速度</span>
  <input id="speed" type="range" min="0" max="3" step="0.05" value="1"
         aria-labelledby="lbl" aria-valuemin="0" aria-valuemax="3">
  <span class="readout">
    <span id="mult">1.00×</span>
    <span id="kmh">≈ 11.0 km/h</span>
  </span>
  <button class="reset" id="reset" type="button">恢复 1×</button>
</div>

<p class="caption"><b>鹈鹕骑自行车</b> · 纯 SVG + SMIL 动画，滑块调速靠接管 SMIL 时间轴实现</p>

<script>
(function () {
  var svg    = document.querySelector('.stage svg');
  var slider = document.getElementById('speed');
  var mult   = document.getElementById('mult');
  var kmh    = document.getElementById('kmh');
  var reset  = document.getElementById('reset');
  if (!svg || !slider || typeof svg.pauseAnimations !== 'function') return;

  // 卡通比例下的换算：轮半径 75 单位 ≈ 34cm，1× 时 0.7s 转一圈
  //   v = 2π·0.34m / 0.7s = 3.05 m/s ≈ 11.0 km/h
  var KMH_PER_X = 10.99;

  var speed = parseFloat(slider.value) || 1;
  var t     = 0;          // 我们自己的虚拟时间（秒）
  var last  = 0;
  var raf   = 0;

  // 关键：暂停 SMIL 自带的时钟，改由 rAF 推进，这样改速度不会重启动画、
  // 也不会打乱车轮/曲柄/双腿之间的相位同步。
  svg.pauseAnimations();
  svg.setCurrentTime(0);

  function render() { svg.setCurrentTime(t); }

  function tick(now) {
    // 上限 50ms：切走标签页再回来时不要一下子跳过去一大段
    var dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    t += dt * speed;
    render();
    raf = requestAnimationFrame(tick);
  }

  function start() {
    if (raf || speed <= 0) return;
    last = performance.now();
    raf = requestAnimationFrame(tick);
  }

  function stop() {
    if (!raf) return;
    cancelAnimationFrame(raf);
    raf = 0;
  }

  function sync() {
    speed = parseFloat(slider.value);
    mult.textContent = speed.toFixed(2) + '\u00d7';
    kmh.textContent  = '\u2248 ' + (speed * KMH_PER_X).toFixed(1) + ' km/h';
    slider.style.setProperty('--p', (slider.value / slider.max * 100) + '%');
    slider.setAttribute('aria-valuetext', speed.toFixed(2) + ' 倍速，约 ' +
                                         (speed * KMH_PER_X).toFixed(1) + ' 公里每小时');
    if (speed > 0) start();
    else { stop(); render(); }   // 0× 就直接停帧，不空转
  }

  slider.addEventListener('input', sync);
  reset.addEventListener('click', function () { slider.value = 1; sync(); });

  // 页面不可见时没必要继续算
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) stop();
    else { last = performance.now(); start(); }
  });

  sync();
})();
</script>
