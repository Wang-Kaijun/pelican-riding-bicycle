<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="一只沿海岸骑自行车的鹈鹕。纯 SVG 动画，可用滑块连续调节 0–3 倍骑行速度。">
<title>海风骑行 · 鹈鹕与自行车</title>
<style>
  :root { color-scheme: light dark; --background: light-dark(#fafbf7, #102c33); --foreground: light-dark(#274b4b, #d3e4dc); --muted-foreground: light-dark(#5c716a, #aec5bb); }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--background); color: var(--foreground); font: 400 16px/1.6 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
  main { max-width: 980px; margin: 48px auto; padding: 0 24px; }
  .form-label { font-weight: 500; }
  .form-range { display: block; width: 100%; min-height: 44px; margin: 0; cursor: pointer; accent-color: light-dark(#426f66, #9dccb5); }
  .tabular-nums { font-variant-numeric: tabular-nums; }
  .text-small { font-size: 12px; }
  .text-muted { color: var(--muted-foreground); }
  @media (max-width: 600px) { main { margin: 24px auto; padding: 0 16px; } }
</style>
</head>
<body>
<main aria-label="鹈鹕骑行动画">
<div id="pelican-ride">

      --pr-sky: light-dark(#e8f4ec, #183b43);
      --pr-cloud: light-dark(#fcfcf0, #41636b);
      --pr-sun: light-dark(#f6d37a, #d6bc78);
      --pr-sea: light-dark(#b5d9ce, #356167);
      --pr-wave: light-dark(#e1eee3, #648887);
      --pr-island: light-dark(#88b8a3, #487362);
      --pr-sand: light-dark(#f3e9c9, #52625a);
      --pr-road: light-dark(#e3debd, #3b514b);
      --pr-stripe: light-dark(#fff8dc, #8a9c87);
      --pr-leaf: light-dark(#67917d, #547f6b);
      --pr-shadow: light-dark(#2a5752, #10272b);
      --pr-outline: light-dark(#294a49, #102d33);
      --pr-metal: light-dark(#a9c0b5, #8ca8a5);
      --pr-spoke: light-dark(#719890, #7b9e98);
      --pr-bike: light-dark(#e87b63, #e58c72);
      --pr-bike-light: light-dark(#ffb794, #ffd1a4);
      --pr-feather: light-dark(#fffdf0, #e5e6d4);
      --pr-feather-shade: light-dark(#d9e6da, #b1c8be);
      --pr-feather-detail: light-dark(#a4b9aa, #829e91);
      --pr-bill: light-dark(#f0b647, #e2ac52);
      --pr-bill-light: light-dark(#ffd373, #f3c76c);
      --pr-pouch: light-dark(#f2ce86, #dcbc81);
      --pr-foot: light-dark(#e7a443, #dfb16a);
      --pr-far-foot: light-dark(#c28a42, #b18b55);
      --pr-scarf: light-dark(#e98265, #ed9b76);
      --pr-helmet: light-dark(#426f66, #568a7d);
      color: var(--foreground, var(--pr-ink));
      width: 100%;
    }
    #pelican-ride .pr-scene { display: block; width: 100%; height: auto; overflow: hidden; }
    #pelican-ride .pr-controls { margin-top: 16px; }
    #pelican-ride .pr-control-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 8px; }
    #pelican-ride .pr-control-head label { margin: 0; }
    #pelican-ride .pr-range-ends { display: flex; justify-content: space-between; margin-top: 2px; }
    #pelican-ride .pr-line { stroke: var(--pr-outline); stroke-linecap: round; stroke-linejoin: round; }
    #pelican-ride .pr-feather { fill: var(--pr-feather); stroke: var(--pr-outline); stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
    #pelican-ride .pr-feather-mark { fill: none; stroke: var(--pr-feather-detail); stroke-width: 2.5; stroke-linecap: round; }
  </style>

  <svg class="pr-scene" viewBox="0 0 920 550" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pr-title pr-description">

        </g>

  </svg>

  <div class="pr-controls">
    <div class="pr-control-head">
      <label class="form-label" for="pr-speed">骑行速度</label>
      <output id="pr-speed-output" class="tabular-nums" for="pr-speed" aria-live="polite">1.0×</output>
    </div>
    <input class="form-range" id="pr-speed" type="range" min="0" max="3" step="0.1" value="1" aria-valuetext="1.0 倍速"/>
    <div class="pr-range-ends text-small text-muted"><span>0× · 暂停</span><span>3× · 飞驰</span></div>
  </div>

  <script>
    (() => {
      const root = document.getElementById('pelican-ride');
      const part = id => root.querySelector('#pr-' + id);
      const slider = part('speed');
      const output = part('speed-output');
      const bird = part('bird');
      const crank = part('crank');
      const rear = part('rear-spokes');
      const front = part('front-spokes');
      const road = part('road');
      const plants = part('plants');
      const clouds = part('clouds');
      const waves = part('waves');
      const scarf = part('scarf-tail');
      const eye = part('eye');
      const breeze = part('breeze');
      const legs = ['far', 'near'].map(side => ({
        outline: part(side + '-leg-outline'),
        color: part(side + '-leg-color'),
        foot: part(side + '-foot')
      }));
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      let speed = reducedMotion.matches ? 0 : 1;
      let rideTime = 0;
      let previousTime = null;
      let frameId = null;
      const cadence = Math.PI * 2 * 0.6;
      const gearRatio = 1.65;

      function positionLeg(leg, x, y, hipX, hipY) {
        const ankleX = x - 8;
        const ankleY = y - 8;
        const dx = ankleX - hipX;
        const dy = ankleY - hipY;
        const distance = Math.max(0.001, Math.hypot(dx, dy));
        const upper = 65;
        const lower = 66;
        const along = (upper * upper - lower * lower + distance * distance) / (2 * distance);
        const bend = Math.sqrt(Math.max(0, upper * upper - along * along));
        const kneeX = hipX + dx * along / distance + dy * bend / distance;
        const kneeY = hipY + dy * along / distance - dx * bend / distance;
        const shape = `M${hipX.toFixed(2)} ${hipY.toFixed(2)}L${kneeX.toFixed(2)} ${kneeY.toFixed(2)}L${ankleX.toFixed(2)} ${ankleY.toFixed(2)}`;
        leg.outline.setAttribute('d', shape);
        leg.color.setAttribute('d', shape);
        leg.foot.setAttribute('transform', `translate(${x.toFixed(2)} ${y.toFixed(2)})`);
      }

      function draw() {
        const phase = rideTime * cadence;
        const angle = phase * 180 / Math.PI;
        const wheelAngle = angle * gearRatio;
        const distance = phase * gearRatio * 86;
        const bob = Math.sin(phase * 2) * 1.6;
        const pedalX = Math.cos(phase) * 28;
        const pedalY = Math.sin(phase) * 28;
        crank.setAttribute('transform', `translate(431 415) rotate(${angle % 360})`);
        rear.setAttribute('transform', `rotate(${wheelAngle % 360})`);
        front.setAttribute('transform', `rotate(${wheelAngle % 360})`);
        bird.setAttribute('transform', `translate(0 ${bob})`);
        positionLeg(legs[0], 431 - pedalX, 415 - pedalY, 411, 317 + bob);
        positionLeg(legs[1], 431 + pedalX, 415 + pedalY, 421, 320 + bob);
        road.setAttribute('transform', `translate(${-distance % 180} 0)`);
        plants.setAttribute('transform', `translate(${-(distance * 0.75) % 920} 0)`);
        clouds.setAttribute('transform', `translate(${-(distance * 0.035) % 990} 0)`);
        waves.setAttribute('transform', `translate(${-(distance * 0.12) % 1040} 0)`);
        scarf.setAttribute('transform', `rotate(${Math.sin(phase * 2.5) * 4} 457 237)`);
        const blinkPosition = rideTime % 5.4;
        const blink = blinkPosition > 5.23 ? 0.12 + 0.88 * Math.abs((blinkPosition - 5.315) / 0.085) : 1;
        eye.setAttribute('transform', `translate(0 ${188 * (1 - blink)}) scale(1 ${blink})`);
        breeze.setAttribute('opacity', speed === 0 ? 0 : Math.min(0.8, speed * 0.28));
        breeze.setAttribute('transform', `translate(${-12 * Math.sin(phase)} 0)`);
      }

      function frame(timestamp) {
        frameId = null;
        if (!root.isConnected) return;
        if (previousTime !== null) {
          const seconds = Math.min((timestamp - previousTime) / 1000, 0.05);
          rideTime += seconds * speed;
        }
        previousTime = timestamp;
        draw();
        if (speed > 0 && !document.hidden) frameId = requestAnimationFrame(frame);
      }

      function resume() {
        if (speed > 0 && frameId === null && !document.hidden) {
          previousTime = null;
          frameId = requestAnimationFrame(frame);
        }
      }

      function setSpeed(value) {
        speed = Number(value);
        slider.value = String(speed);
        output.textContent = speed === 0 ? '0× · 已暂停' : speed.toFixed(1) + '×';
        slider.setAttribute('aria-valuetext', speed === 0 ? '已暂停' : speed.toFixed(1) + ' 倍速');
        if (speed === 0 && frameId !== null) {
          cancelAnimationFrame(frameId);
          frameId = null;
        }
        draw();
        resume();
      }

      slider.addEventListener('input', () => setSpeed(slider.value));
      reducedMotion.addEventListener('change', event => { if (event.matches) setSpeed(0); });
      document.addEventListener('visibilitychange', () => {
        if (document.hidden && frameId !== null) {
          cancelAnimationFrame(frameId);
          frameId = null;
        } else resume();
      });
      setSpeed(speed);
    })();
  </script>
</div>

</main>
</body>
</html>
