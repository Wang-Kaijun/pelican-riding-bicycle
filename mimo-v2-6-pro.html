<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>鹈鹕骑自行车</title>
  <style>
    :root {
      --sky: #b8e0f6;
      --ink: #2c3e50;
      --accent: #ff6b35;
      --teal: #2a9d8f;
      --cream: #fff8e7;
      --muted: #5b7083;
      --card: #ffffff;
      --shadow: 0 18px 40px rgba(44, 62, 80, 0.12);
      --radius: 22px;
      --font: "Segoe UI", "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      font-family: var(--font);
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 10%, #fff6df 0%, transparent 40%),
        radial-gradient(circle at 85% 0%, #d7f0fa 0%, transparent 35%),
        linear-gradient(180deg, #f4fbff 0%, #e8f4fc 48%, #dff0e4 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 28px 16px 40px;
    }

    .stage {
      width: min(920px, 100%);
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .hero {
      text-align: center;
      padding: 4px 8px 0;
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(26px, 4vw, 34px);
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--ink);
    }

    .subtitle {
      margin: 8px 0 0;
      font-size: 15px;
      color: var(--muted);
      font-weight: 400;
    }

    .scene-card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      border: 1px solid rgba(44, 62, 80, 0.06);
    }

    .scene {
      display: block;
      width: 100%;
      height: auto;
      background: var(--sky);
      touch-action: none;
      user-select: none;
    }

    .controls {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid rgba(44, 62, 80, 0.06);
      padding: 18px 22px 16px;
    }

    .control-row {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 14px;
      align-items: center;
    }

    .slider-label {
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
    }

    .speed-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 10px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent) var(--fill, 35%), #e6eef5 var(--fill, 35%));
      outline: none;
      cursor: pointer;
    }

    .speed-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #ffffff;
      border: 3px solid var(--accent);
      box-shadow: 0 2px 8px rgba(255, 107, 53, 0.35);
      cursor: grab;
      transition: transform 0.15s ease;
    }

    .speed-slider::-webkit-slider-thumb:hover {
      transform: scale(1.08);
    }

    .speed-slider::-moz-range-thumb {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #ffffff;
      border: 3px solid var(--accent);
      box-shadow: 0 2px 8px rgba(255, 107, 53, 0.35);
      cursor: grab;
    }

    .speed-slider::-moz-range-track {
      height: 10px;
      border-radius: 999px;
      background: transparent;
    }

    .speed-readout {
      min-width: 64px;
      text-align: right;
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      font-size: 22px;
      color: var(--accent);
      line-height: 1;
    }

    .speed-readout .unit {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      margin-left: 2px;
    }

    .control-meta {
      margin-top: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      font-size: 13px;
      color: var(--muted);
    }

    .control-meta .dot {
      opacity: 0.5;
    }

    #speed-mood {
      color: var(--teal);
      font-weight: 600;
    }

    @media (max-width: 560px) {
      .control-row {
        grid-template-columns: 1fr auto;
        grid-template-areas:
          "label readout"
          "slider slider";
        gap: 10px 12px;
      }

      .slider-label {
        grid-area: label;
      }

      .speed-slider {
        grid-area: slider;
      }

      .speed-readout {
        grid-area: readout;
      }

      .controls {
        padding: 16px;
      }
    }
  </style>
</head>

      const cloudsNear = $("clouds-near");

      const foreground = $("foreground");
      const hillsFar = $("hills-far");
      const hillsNear = $("hills-near");

      const SVG_NS = "http://www.w3.org/2000/svg";

      function makeCloud(x, y, scale, opacity) {
        const g = document.createElementNS(SVG_NS, "g");
        g.dataset.baseX = String(x);
        g.dataset.baseY = String(y);
        g.dataset.scale = String(scale);
        g.setAttribute("opacity", String(opacity));
        g.innerHTML = `
          <ellipse cx="0" cy="0" rx="34" ry="18" fill="#ffffff" />
          <ellipse cx="-22" cy="4" rx="20" ry="14" fill="#ffffff" />
          <ellipse cx="22" cy="3" rx="22" ry="13" fill="#ffffff" />
          <ellipse cx="2" cy="-10" rx="18" ry="14" fill="#ffffff" />
        `;
        g.setAttribute("transform", `translate(${x}, ${y}) scale(${scale})`);
        return g;
      }

      function seedClouds(layer, configs) {
        configs.forEach((c) => layer.appendChild(makeCloud(c.x, c.y, c.s, c.o)));
      }

      seedClouds(cloudsFar, [
        { x: 80, y: 70, s: 0.9, o: 0.75 },
        { x: 260, y: 50, s: 0.7, o: 0.65 },
        { x: 480, y: 78, s: 1.0, o: 0.7 },
        { x: 700, y: 55, s: 0.8, o: 0.68 },
        { x: 900, y: 72, s: 0.85, o: 0.72 },
        { x: 1100, y: 48, s: 0.75, o: 0.6 },
        { x: -80, y: 88, s: 0.8, o: 0.66 },
        { x: -260, y: 60, s: 0.7, o: 0.58 },
        { x: -480, y: 75, s: 0.9, o: 0.7 },
        { x: -700, y: 52, s: 0.78, o: 0.62 },
        { x: -900, y: 68, s: 0.82, o: 0.68 },
        { x: -1100, y: 45, s: 0.7, o: 0.55 },
      ]);

      seedClouds(cloudsNear, [
        { x: 140, y: 110, s: 1.1, o: 0.92 },
        { x: 420, y: 95, s: 0.9, o: 0.88 },
        { x: 680, y: 120, s: 1.0, o: 0.9 },
        { x: 960, y: 100, s: 0.95, o: 0.85 },
        { x: -140, y: 115, s: 1.0, o: 0.88 },
        { x: -420, y: 98, s: 0.88, o: 0.85 },
        { x: -680, y: 118, s: 1.05, o: 0.9 },
        { x: -960, y: 102, s: 0.9, o: 0.84 },
      ]);

      const DASH_SPACING = 48;
      const DASH_COUNT = 28;
      const DASH_SPAN = DASH_SPACING * DASH_COUNT;
      for (let i = 0; i < DASH_COUNT; i += 1) {
        const line = document.createElementNS(SVG_NS, "line");
        line.setAttribute("y1", "352");
        line.setAttribute("y2", "352");
        roadDashes.appendChild(line);
      }

      function makeGrass(x, y, h, lean) {
        const g = document.createElementNS(SVG_NS, "g");
        g.dataset.bx = String(x);
        g.dataset.by = String(y);
        g.setAttribute("transform", `translate(${x}, ${y})`);
        g.innerHTML = `
          <path d="M0 0 Q ${lean * 0.3} ${-h * 0.55} ${lean} ${-h}"
            fill="none" stroke="#4f9f45" stroke-width="3.5" stroke-linecap="round" />
          <path d="M6 0 Q ${6 + lean * 0.15} ${-h * 0.45} ${8 + lean * 0.5} ${-h * 0.8}"
            fill="none" stroke="#5eaf52" stroke-width="3" stroke-linecap="round" />
        `;
        return g;
      }

      const GRASS_SPAN = 880;
      for (let i = 0; i < 16; i += 1) {
        const items = [
          { x: i * 55 - 20, y: 392, h: 14 + (i % 3) * 5, lean: (i % 2 === 0 ? 1 : -1) * (4 + (i % 4)) },
          { x: i * 55 + 18, y: 396, h: 10 + (i % 2) * 4, lean: (i % 2 === 0 ? -1 : 1) * 5 },
        ];
        items.forEach((c) => {
          foreground.appendChild(makeGrass(c.x, c.y, c.h, c.lean));
          foreground.appendChild(makeGrass(c.x + GRASS_SPAN, c.y, c.h, c.lean));
          foreground.appendChild(makeGrass(c.x - GRASS_SPAN, c.y, c.h, c.lean));
        });
      }

      function solveLeg(hip, pedal, thighLen, shinLen) {
        const dx = pedal.x - hip.x;
        const dy = pedal.y - hip.y;
        const dist = Math.hypot(dx, dy);
        const maxReach = thighLen + shinLen - 0.01;
        const minReach = Math.abs(thighLen - shinLen) + 0.01;
        const d = Math.min(maxReach, Math.max(minReach, dist));
        const scale = dist > 1e-4 ? d / dist : 1;
        const tx = hip.x + dx * scale;
        const ty = hip.y + dy * scale;

        const a = (thighLen * thighLen - shinLen * shinLen + d * d) / (2 * d);
        const h = Math.sqrt(Math.max(0, thighLen * thighLen - a * a));
        const mx = hip.x + ((tx - hip.x) * a) / d;
        const my = hip.y + ((ty - hip.y) * a) / d;
        const ux = d > 1e-4 ? -(ty - hip.y) / d : 1;
        const uy = d > 1e-4 ? (tx - hip.x) / d : 0;
        return {
          knee: { x: mx - ux * h, y: my - uy * h },
          foot: { x: tx, y: ty },
        };
      }

      function moodFor(value) {
        if (value <= 0) return "原地休息";
        if (value < 25) return "悠闲慢骑";
        if (value < 50) return "轻快巡航";
        if (value < 75) return "加速前进";
        return "全力冲刺";
      }

      function setSliderFill(value) {
        slider.style.setProperty("--fill", `${value}%`);
      }

      let targetSpeed = Number(slider.value);
      let currentSpeed = targetSpeed;
      let wheelAngle = 0;
      let pedalAngle = Math.PI * 0.15;
      let roadOffset = 0;
      let cloudFarOffset = 0;
      let cloudNearOffset = 0;
      let grassOffset = 0;
      let hillFarOffset = 0;
      let hillNearOffset = 0;
      let bobPhase = 0;
      let lastTs = performance.now();

      function onSliderInput() {
        targetSpeed = Number(slider.value);
        slider.setAttribute("aria-valuenow", String(targetSpeed));
        speedValue.textContent = String(targetSpeed);
        speedMood.textContent = moodFor(targetSpeed);
        setSliderFill(targetSpeed);
      }

      slider.addEventListener("input", onSliderInput);
      setSliderFill(targetSpeed);
      speedMood.textContent = moodFor(targetSpeed);

      function placePedal(el, angle) {
        const x = Math.cos(angle) * CRANK_RADIUS;
        const y = Math.sin(angle) * CRANK_RADIUS;
        el.setAttribute("transform", `translate(${x}, ${y})`);
      }

      function updateLeg(legEl, angle, far) {
        const pedalX = CRANK.x + Math.cos(angle) * CRANK_RADIUS;
        const pedalY = CRANK.y + Math.sin(angle) * CRANK_RADIUS;
        const hip = far ? { x: HIP.x - 6, y: HIP.y + 2 } : HIP;
        const { knee, foot } = solveLeg(hip, { x: pedalX, y: pedalY }, THIGH, SHIN);

        legEl
          .querySelector(".thigh")
          .setAttribute(
            "d",
            `M ${hip.x} ${hip.y} Q ${(hip.x + knee.x) / 2 + 2} ${(hip.y + knee.y) / 2} ${knee.x} ${knee.y}`
          );
        legEl
          .querySelector(".shin")
          .setAttribute(
            "d",
            `M ${knee.x} ${knee.y} Q ${(knee.x + foot.x) / 2} ${(knee.y + foot.y) / 2 + 1} ${foot.x} ${foot.y}`
          );

        const footEl = legEl.querySelector(".foot");
        if (footEl) {
          footEl.setAttribute("cx", String(foot.x + 2));
          footEl.setAttribute("cy", String(foot.y + 2));
        }

        const kneeEl = legEl.querySelector(".knee");
        if (kneeEl) {
          kneeEl.setAttribute("cx", String(knee.x));
          kneeEl.setAttribute("cy", String(knee.y));
        }
      }

      function wrapX(value, span) {
        return ((((value + span / 2) % span) + span) % span) - span / 2;
      }

      function updateClouds(layer, offset, span) {
        Array.from(layer.children).forEach((child) => {
          const bx = Number(child.dataset.baseX);
          const by = Number(child.dataset.baseY);
          const scale = Number(child.dataset.scale);
          const x = wrapX(bx + offset, span);
          child.setAttribute("transform", `translate(${x}, ${by}) scale(${scale})`);
        });
      }

      function updateDashes(offset) {
        Array.from(roadDashes.children).forEach((line, i) => {
          const x = wrapX(i * DASH_SPACING + offset, DASH_SPAN) - 40;
          line.setAttribute("x1", String(x));
          line.setAttribute("x2", String(x + 28));
        });
      }

      function updateGrass(offset) {
        Array.from(foreground.children).forEach((child) => {
          const x = wrapX(Number(child.dataset.bx) + offset, GRASS_SPAN);
          child.setAttribute("transform", `translate(${x}, ${child.dataset.by})`);
        });
      }

      function updateHills(layer, offset) {
        const x = wrapX(offset, HILL_PERIOD);
        layer.setAttribute("transform", `translate(${x}, 0)`);
      }

      function frame(ts) {
        const dt = Math.min(0.05, (ts - lastTs) / 1000);
        lastTs = ts;

        if (targetSpeed <= 0) {
          currentSpeed = 0;
        } else {
          currentSpeed += (targetSpeed - currentSpeed) * Math.min(1, dt * 5);
          if (Math.abs(targetSpeed - currentSpeed) < 0.5) {
            currentSpeed = targetSpeed;
          }
        }
        const norm = currentSpeed / SPEED_MAX;
        const active = norm > 0.001;

        if (active) {
          const omega = BASE_WHEEL_SPEED * norm;
          wheelAngle += omega * dt;
          pedalAngle += omega * 1.55 * dt;

          const worldSpeed = 140 * norm;
          roadOffset -= worldSpeed * dt;
          cloudFarOffset -= worldSpeed * 0.08 * dt;
          cloudNearOffset -= worldSpeed * 0.18 * dt;
          grassOffset -= worldSpeed * 1.15 * dt;
          hillFarOffset -= worldSpeed * 0.06 * dt;
          hillNearOffset -= worldSpeed * 0.12 * dt;
          bobPhase += dt * (2.2 + norm * 4);
        }

        const deg = (wheelAngle * 180) / Math.PI;
        wheelRear.setAttribute("transform", `translate(275, 300) rotate(${deg})`);
        wheelFront.setAttribute("transform", `translate(445, 300) rotate(${deg})`);

        const crankDeg = (pedalAngle * 180) / Math.PI;
        crankArm.setAttribute("transform", `rotate(${crankDeg})`);
        placePedal(pedalNear, pedalAngle);
        placePedal(pedalFar, pedalAngle + Math.PI);

        updateLeg(legNear, pedalAngle, false);
        updateLeg(legFar, pedalAngle + Math.PI, true);

        const bob = active ? Math.sin(bobPhase) * (1.2 + norm * 2.2) : 0;
        const sway = active ? Math.cos(bobPhase * 0.5) * (0.4 + norm * 0.8) : 0;
        rider.setAttribute("transform", `translate(${sway}, ${bob})`);

        const pouchTilt = active ? Math.sin(bobPhase * 1.3) * (1 + norm * 2) : 0;
        pouch.setAttribute("transform", `rotate(${pouchTilt}, 374, 134)`);

        const scarfWave = active ? Math.sin(bobPhase * 1.7) * (3 + norm * 8) : 0;
        scarfTail.setAttribute(
          "d",
          `M 336 218 Q ${312 - scarfWave * 0.3} ${226 + scarfWave * 0.2} ${298 - scarfWave} 216 Q ${286 - scarfWave * 0.6} 210 ${278 - scarfWave * 0.8} 218`
        );

        const wingFlap = active ? Math.sin(bobPhase * 2.1) * (2 + norm * 5) : 0;
        wing.setAttribute("transform", `rotate(${wingFlap}, 300, 222)`);

        riderShadow.setAttribute("rx", String(120 + bob * 0.5));
        riderShadow.setAttribute("opacity", String(Math.max(0.06, 0.12 - Math.abs(bob) * 0.004)));

        updateClouds(cloudsFar, cloudFarOffset, 1400);
        updateClouds(cloudsNear, cloudNearOffset, 1400);
        updateDashes(roadOffset);
        updateGrass(grassOffset);
        updateHills(hillsFar, hillFarOffset);
        updateHills(hillsNear, hillNearOffset);

        requestAnimationFrame(frame);
      }

      updateLeg(legNear, pedalAngle, false);
      updateLeg(legFar, pedalAngle + Math.PI, true);
      placePedal(pedalNear, pedalAngle);
      placePedal(pedalFar, pedalAngle + Math.PI);

      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
