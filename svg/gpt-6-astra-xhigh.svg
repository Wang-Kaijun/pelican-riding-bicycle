    <title id="pr-title">海风中的鹈鹕骑行</title>
    <desc id="pr-description">一只戴绿色头盔、系珊瑚色围巾的白鹈鹕，骑着珊瑚色自行车沿海岸前进。双脚交替踩踏，车轮转动，云朵与道路向后移动。下方滑块可以调节速度，调到零即可暂停。</desc>
