999999999" fill="#5d9c50"/><circle cx="1212.75" cy="381.3" r="11.049999999999999" fill="#5d9c50"/><circle cx="1200" cy="367.7" r="16.15" fill="#69ad5c"/></g></g>

    <!-- 路面与草地 -->
    <rect x="0" y="400" width="900" height="52" fill="#6b7280"/>
    <rect x="0" y="452" width="900" height="28" fill="#7fbf6a"/>
    <g id="dashes" transform="translate(-20.3 0)"><rect x="-60" y="424" width="34" height="5" rx="2.5" fill="#f5f7fa" opacity="0.85"/><rect x="0" y="424" width="34" height="5" rx="2.5" fill="#f5f7fa" opacity="0.85"/><rect x="60" y="424" width="34" height="5" rx="2.5" fill="#f5f7fa" opacity="0.85"/><rect x="120" y="424" width="34" height="5" rx="2.5" fill="#f5f7fa" opacity="0.85"/><rect x="180" y="424" width="34" height="5" rx="2.5" fill="#f5f7fa" opacity="0.85"/><rect x="240" y="424" width="34" height="5" rx="2.5" fill="#f5f7fa" opacity="0.85"/><rect x="300" y="424" width="34" height="5" rx="2.5" fill="#f5f7fa" opacity="0.85"/><rect x="360" y="424" width="34" height="5" rx="2.5" fill="#f5f7fa" opacity="0.85"/><rect x="420" y="424" width="34" height="5" rx="2.5" fill="#f5f7fa" opacity="0.85"/><rect x="480" y="424" width="34" height="5" rx="2.5" fill="#f5f7fa" opacity="0.85"/><rect x="540" y="424" width="34" height="5" rx="2.5" fill="#f5f7fa" opacity="0.85"/><rect x="600" y="424" width="34" height="5" rx="2.5" fill="#f5f7fa" opacity="0.85"/><rect x="660" y="424" width="34" height="5" rx="2.5" fill="#f5f7fa" opacity="0.85"/><rect x="720" y="424" width="34" height="5" rx="2.5" fill="#f5f7fa" opacity="0.85"/><rect x="780" y="424" width="34" height="5" rx="2.5" fill="#f5f7fa" opacity="0.85"/><rect x="840" y="424" width="34" height="5" rx="2.5" fill="#f5f7fa" opacity="0.85"/><rect x="900" y="424" width="34" height="5" rx="2.5" fill="#f5f7fa" opacity="0.85"/><rect x="960" y="424" width="34" height="5" rx="2.5" fill="#f5f7fa" opacity="0.85"/></g>
    <g id="bushes" transform="translate(-400.3 0)"><ellipse cx="-850" cy="470" rx="18" ry="7.699999999999999" fill="#5a9d52"/><ellipse cx="-650" cy="470" rx="15" ry="5.6" fill="#5a9d52"/><ellipse cx="-470" cy="470" rx="20" ry="9.1" fill="#5a9d52"/><ellipse cx="-240" cy="470" rx="16" ry="6.3" fill="#5a9d52"/><ellipse cx="-80" cy="470" rx="19" ry="8.399999999999999" fill="#5a9d52"/><ellipse cx="50" cy="470" rx="18" ry="7.699999999999999" fill="#5a9d52"/><ellipse cx="250" cy="470" rx="15" ry="5.6" fill="#5a9d52"/><ellipse cx="430" cy="470" rx="20" ry="9.1" fill="#5a9d52"/><ellipse cx="660" cy="470" rx="16" ry="6.3" fill="#5a9d52"/><ellipse cx="820" cy="470" rx="19" ry="8.399999999999999" fill="#5a9d52"/><ellipse cx="950" cy="470" rx="18" ry="7.699999999999999" fill="#5a9d52"/><ellipse cx="1150" cy="470" rx="15" ry="5.6" fill="#5a9d52"/><ellipse cx="1330" cy="470" rx="20" ry="9.1" fill="#5a9d52"/><ellipse cx="1560" cy="470" rx="16" ry="6.3" fill="#5a9d52"/><ellipse cx="1720" cy="470" rx="19" ry="8.399999999999999" fill="#5a9d52"/></g>

    <!-- 车影 -->
    <ellipse cx="400" cy="404" rx="212" ry="9" fill="#000" opacity="0.13"/>

    <!-- 速度线 -->
    <g id="speedLines" opacity="0.00" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-dasharray="34 96" style="stroke-dashoffset: -122.438;">
      <line x1="60" y1="160" x2="230" y2="160"/>
      <line x1="30" y1="212" x2="220" y2="212"/>
      <line x1="70" y1="268" x2="240" y2="268"/>
    </g>

    <!-- 自行车 + 鹈鹕 -->
    <g id="bike">
      <!-- 远侧曲柄 / 脚踏 / 腿（画在车架后面） -->
      <line id="farCrank" x1="390" y1="340" x2="405.8" y2="309.9" stroke="#1f2933" stroke-width="6" stroke-linecap="round"/>
      <rect id="farPedal" x="395.8" y="306.4" width="20" height="7" rx="3" fill="#1f2933"/>
      <path id="farLeg" d="M346.0,238.2 L418.0,238.3 L410.8,307.9" fill="none" stroke="#c97f22" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
      <ellipse id="farFoot" cx="412.8" cy="306.9" rx="12" ry="5" fill="#c97f22"/>

      <!-- 后轮 -->
      <g id="rearWheel">
        <circle cx="260" cy="340" r="60" fill="none" stroke="#23272e" stroke-width="9"/>
        <circle cx="260" cy="340" r="52" fill="none" stroke="#8d949e" stroke-width="3"/>
        <g id="rearSpokes" transform="rotate(305.84 260 340)"><line x1="211.0" y1="340.0" x2="309.0" y2="340.0" stroke="#9aa0a6" stroke-width="2.5"/><line x1="225.4" y1="305.4" x2="294.6" y2="374.6" stroke="#9aa0a6" stroke-width="2.5"/><line x1="260.0" y1="291.0" x2="260.0" y2="389.0" stroke="#9aa0a6" stroke-width="2.5"/><line x1="294.6" y1="305.4" x2="225.4" y2="374.6" stroke="#9aa0a6" stroke-width="2.5"/><circle cx="286" cy="340" r="4" fill="#ff9f1a"/></g>
        <circle cx="260" cy="340" r="6.5" fill="#4b5563"/>
      </g>

      <!-- 前轮 -->
      <g id="frontWheel">
        <circle cx="540" cy="340" r="60" fill="none" stroke="#23272e" stroke-width="9"/>
        <circle cx="540" cy="340" r="52" fill="none" stroke="#8d949e" stroke-width="3"/>
        <g id="frontSpokes" transform="rotate(305.84 540 340)"><line x1="491.0" y1="340.0" x2="589.0" y2="340.0" stroke="#9aa0a6" stroke-width="2.5"/><line x1="505.4" y1="305.4" x2="574.6" y2="374.6" stroke="#9aa0a6" stroke-width="2.5"/><line x1="540.0" y1="291.0" x2="540.0" y2="389.0" stroke="#9aa0a6" stroke-width="2.5"/><line x1="574.6" y1="305.4" x2="505.4" y2="374.6" stroke="#9aa0a6" stroke-width="2.5"/><circle cx="566" cy="340" r="4" fill="#ff9f1a"/></g>
        <circle cx="540" cy="340" r="6.5" fill="#4b5563"/>
      </g>

      <!-- 链条与牙盘 -->
      <circle cx="390" cy="340" r="15" fill="none" stroke="#444" stroke-width="4"/>
      <circle cx="260" cy="340" r="7" fill="none" stroke="#444" stroke-width="3.5"/>
      <line id="chainTop" x1="390" y1="325" x2="260" y2="333" stroke="#555" stroke-width="3" stroke-dasharray="6 4" style="stroke-dashoffset: -2.0959;"/>
      <line id="chainBottom" x1="390" y1="355" x2="260" y2="347" stroke="#555" stroke-width="3" stroke-dasharray="6 4" style="stroke-dashoffset: -2.0959;"/>

      <!-- 车架 -->
      <g stroke="#e74c3c" stroke-width="7" stroke-linecap="round" fill="none">
        <path d="M390,340 L510,297"/>
        <path d="M354,258 L506,250"/>
        <path d="M390,340 L351,255"/>
        <path d="M352,262 L262,340"/>
        <path d="M390,340 L260,340"/>
      </g>
      <!-- 前叉 / 车把 -->
      <line x1="514" y1="298" x2="540" y2="340" stroke="#333" stroke-width="6" stroke-linecap="round"/>
      <line x1="506" y1="250" x2="514" y2="298" stroke="#e74c3c" stroke-width="8" stroke-linecap="round"/>
      <path d="M508,247 C512,238 518,234 524,233" stroke="#333" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M524,233 C530,228 538,230 541,236" stroke="#333" stroke-width="5" fill="none" stroke-linecap="round"/>
      <circle cx="541" cy="236" r="4.5" fill="#222"/>
      <!-- 车座 -->
      <path d="M330,254 L374,254 Q372,245 361,244 L341,244 Q331,245 330,254 Z" fill="#333"/>

      <!-- 鹈鹕 -->
      <g id="pelican">
        <g id="pelicanBody" transform="translate(0 -1.81) rotate(-1.20 338 202)">
          <!-- 尾羽 -->
          <path d="M298,192 L250,164 L264,190 L246,204 L294,212 Z" fill="#fbfbf4" stroke="#d9dccb" stroke-width="2" stroke-linejoin="round"/>
          <!-- 脖子 -->
          <path d="M376,198 C402,193 409,166 417,136" stroke="#fbfbf4" stroke-width="16" fill="none" stroke-linecap="round"/>
          <!-- 身体 -->
          <ellipse cx="338" cy="202" rx="54" ry="36" fill="#fbfbf4" stroke="#d9dccb" stroke-width="2" transform="rotate(-8 338 202)"/>
          <!-- 翅膀（伸向车把） -->
          <path d="M350,186 C394,177 464,199 524,232 C528,236 524,241 517,239 C468,225 404,221 358,214 C345,206 344,194 350,186 Z" fill="#eef0e4" stroke="#d5d8c6" stroke-width="1.5"/>
          <!-- 头 -->
          <circle cx="418" cy="124" r="15.5" fill="#fbfbf4" stroke="#d9dccb" stroke-width="2"/>
          <!-- 帽子 -->
          <path d="M404,116 Q418,97 432,114 Z" fill="#e74c3c"/>
          <line x1="402" y1="117" x2="434" y2="113" stroke="#c0392b" stroke-width="3.5" stroke-linecap="round"/>
          <!-- 大嘴 + 喉囊 -->
          <path d="M428,130 Q447,184 511,151 L428,130 Z" fill="#fbbf5d"/>
          <path d="M427,118 L512,146 Q516,151 510,155 L427,134 Z" fill="#f6a83c" stroke="#d98a1f" stroke-width="1" stroke-linejoin="round"/>
          <!-- 眼睛 -->
          <circle cx="421" cy="114" r="5" fill="#fff"/>
          <circle cx="423" cy="114.5" r="2.6" fill="#2c3e50"/>
          <circle cx="421.8" cy="112.8" r="1" fill="#fff"/>
        </g>
      </g>

      <!-- 近侧曲柄 / 脚踏 / 腿（画在最上层） -->
      <line id="nearCrank" x1="390" y1="340" x2="374.2" y2="370.1" stroke="#374151" stroke-width="6" stroke-linecap="round"/>
      <rect id="nearPedal" x="364.2" y="366.6" width="20" height="7" rx="3" fill="#222"/>
      <path id="nearLeg" d="M352.0,242.2 L395.0,299.9 L379.2,368.1" fill="none" stroke="#f59e2e" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
      <ellipse id="nearFoot" cx="381.2" cy="367.1" rx="12" ry="5" fill="#f59e2e"/>
    </g>
  </svg>